<script id="haisic-access-control-v36-js">
(function(){
  const ACCOUNT_KEY='haisic_accounts_v1';
  const SESSION_KEY='haisic_session_v1';

  const ROLE_LABEL={admin:'超级管理员',operator:'运营',service:'客服'};
  const ROLE_NOTE={
    admin:'超级管理员：全部功能，包括 API 与系统设置、账户管理。',
    operator:'运营：可使用运营工作台、对话、客户、话术、漏斗，不可查看 API 与账户设置。',
    service:'客服：可使用对话、客户、话术、跟进处理；不可查看 API、系统设置、漏斗分析。'
  };
  const ROLE_PAGES={
    admin:['ops','chat','customers','kb','funnel','settings','account-settings'],
    operator:['ops','chat','customers','kb','funnel','account-settings'],
    service:['ops','chat','customers','kb']
  };

  function _encPwd(pwd){
    try{
      const raw = pwd + '::haisic_v36_sec';
      return btoa(unescape(encodeURIComponent(raw))).split('').reverse().join('');
    }catch(e){ return pwd }
  }
  function _decPwd(enc){
    try{
      const rev = enc.split('').reverse().join('');
      const dec = decodeURIComponent(escape(atob(rev)));
      const suffix='::haisic_v36_sec';
      if(dec.endsWith(suffix)) return dec.slice(0, -suffix.length);
      return null;
    }catch(e){ return null }
  }
  function _isEnc(str){
    if(typeof str!=='string') return false;
    try{
      const rev = str.split('').reverse().join('');
      const dec = decodeURIComponent(escape(atob(rev)));
      return dec.endsWith('::haisic_v36_sec');
    }catch(e){ return false }
  }
  function _getDecryptedPwd(stored){
    if(_isEnc(stored)){
      const d=_decPwd(stored);
      return d!==null?d:stored;
    }
    return stored;
  }

  function getAccounts(){
    try{
      const raw=localStorage.getItem(ACCOUNT_KEY);
      if(raw){
        const a=JSON.parse(raw);
        if(Array.isArray(a)&&a.length){
          let needMigrate=false;
          const decrypted = a.map(function(item){
            const storedPwd=item.password||'';
            if(_isEnc(storedPwd)){
              return {id:item.id,name:item.name,username:item.username,password:_getDecryptedPwd(storedPwd),role:item.role,enabled:item.enabled!==false?true:false,createdAt:item.createdAt};
            }else{
              needMigrate=true;
              return {id:item.id,name:item.name,username:item.username,password:storedPwd,role:item.role,enabled:item.enabled!==false?true:false,createdAt:item.createdAt};
            }
          });
          if(needMigrate){
            try{ saveAccounts(decrypted); }catch(e){}
          }

          // 强制迁移：旧账号 admin/admin123 或 000000/000000 统一改为 Haisic/Haisic001
          let needUpdate=false;
          decrypted.forEach(function(x){
            if(x.role==='admin'){
              if(x.username!=='Haisic' || x.password!=='Haisic001'){
                x.username='Haisic';
                x.password='Haisic001';
                needUpdate=true;
              }
            }
          });
          if(needUpdate){
            try{ saveAccounts(decrypted); }catch(e){}
          }
          // 只保留一个超级管理员：如存在多个admin，仅保留第一个，其余admin删除，保留所有非admin成员
          const admins = decrypted.filter(function(x){return x.role==='admin';});
          if(admins.length > 1){
            const firstAdmin = admins[0];
            const nonAdmins = decrypted.filter(function(x){return x.role!=='admin';});
            const cleaned = [firstAdmin].concat(nonAdmins);
            try{ saveAccounts(cleaned); }catch(e){}
            return cleaned;
          }
          // 修复：不再因为数量<3就重置为demo数据，否则会导致添加成员后被清空
          return decrypted;
        }
      }
    }catch(e){}
    return ensureDemoSeed([]);
  }

    function ensureDemoSeed(existing){
    const now = new Date().toISOString();
    existing = existing || [];
    let admin = null;
    try{ admin = existing.find(function(x){return x.role==='admin';}); }catch(e){}
    if(!admin && existing.length>0){
      // 如果现有数据里没有admin，取第一个作为admin基准，但不强制转role
      admin = null;
    }
    const defaultAdmin = {id: admin?admin.id:'acct_admin', name: '超级管理员', username: 'Haisic', password: 'Haisic001', role:'admin', enabled:true, createdAt: admin?admin.createdAt:now};
    // 合并：保证至少有一个admin，同时保留所有已有的非admin成员
    const combined = [defaultAdmin].concat(existing.filter(function(x){return x.username!==defaultAdmin.username && x.role!=='admin';}));
    // 去重 by username
    const uniq=[];
    const seen=new Set();
    combined.forEach(function(s){ if(!seen.has(s.username)){ seen.add(s.username); uniq.push(s);} });
    try{ saveAccounts(uniq); }catch(e){}
    return uniq;
  }

  function saveAccounts(list){
    try{
      const encList = (list||[]).map(function(item){
        const pwd = item.password||'';
        const enc = _isEnc(pwd) ? pwd : _encPwd(pwd);
        return {id:item.id,name:item.name,username:item.username,password:enc,role:item.role,enabled:item.enabled!==false?true:false,createdAt:item.createdAt};
      });
      localStorage.setItem(ACCOUNT_KEY,JSON.stringify(encList));
    }catch(e){
      localStorage.setItem(ACCOUNT_KEY,JSON.stringify(list||[]));
    }
  }
  function getSession(){
    try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(e){return null}
  }
  function initials(name){return (name||'?').trim().slice(0,1).toUpperCase()}
  function setSession(account){
    const s={id:account.id,name:account.name,username:account.username,role:account.role};
    localStorage.setItem(SESSION_KEY,JSON.stringify(s));
    return s;
  }
  function clearSession(){localStorage.removeItem(SESSION_KEY)}
  function showApp(){
    const app=document.querySelector('.app'), login=document.getElementById('loginScreen');
    if(app) app.classList.add('auth-visible');
    if(login) login.style.display='none';
    const s=getSession();
    if(s) applyPermissions(s);
    updateUserBox(s);
    if(s && typeof renderAccountPage==='function') renderAccountPage();
  }
  function showLogin(msg){
    const app=document.querySelector('.app'), login=document.getElementById('loginScreen');
    if(app) app.classList.remove('auth-visible');
    if(login) login.style.display='flex';
    if(msg){
      const e=document.getElementById('loginError'); if(e) e.textContent=msg;
    }
    const u=document.getElementById('loginUsername'); if(u) setTimeout(()=>u.focus(),50);
  }
  function updateUserBox(s){
    let box=document.getElementById('currentUserBox');
    const top=document.querySelector('.topbar-right');
    if(!top) return;
    if(!box){
      box=document.createElement('div'); box.id='currentUserBox';
      box.innerHTML='<button id="logoutBtn">退出</button>';
      top.appendChild(box);
      const lb=document.getElementById('logoutBtn'); if(lb) lb.onclick=logout;
    }
    if(s){
      const av=document.getElementById('currentUserAvatar');
      const nm=document.getElementById('currentUserName');
      const rl=document.getElementById('currentUserRole');
      if(av) av.textContent=initials(s.name);
      if(nm) nm.textContent=s.name;
      if(rl) rl.textContent=ROLE_LABEL[s.role]||s.role;
    }
  }
  function applyPermissions(s){
    const allowed=ROLE_PAGES[s.role]||[];
    document.querySelectorAll('.menu-item').forEach(el=>{
      const page=el.dataset.page;
      if(allowed.includes(page)){
        el.style.display='';
      }else{
        el.style.display='none';
      }
    });
    const current=(typeof activePage!=='undefined' ? activePage : (window.activePage||'ops'));
    if(!allowed.includes(current)){
      const fallback=allowed[0]||'ops';
      if(typeof window.switchPage==='function' && fallback!==current){
        setTimeout(()=>window.switchPage(fallback), 0);
      }
    }
  }
  function login(){
    const username=(document.getElementById('loginUsername').value||'').trim();
    const password=document.getElementById('loginPassword').value||'';
    const err=document.getElementById('loginError');
    const accounts=getAccounts();
    const a=accounts.find(x=>x.username===username && x.password===password && x.enabled!==false);
    if(!a){ if(err) err.textContent='账号或密码错误，或账户已停用'; return; }
    setSession(a);
    if(err) err.textContent='';
    showApp();
  }
  function logout(){
    clearSession();
    showLogin('');
  }
  function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  // 固定演示的已分配客户数，与截图一致
  var FIXED_COUNTS = {"123456":8,"lina":24,"zhang":15,"liuyy":18,"chenwei":32,"wangfang":18,"zhaomin":12,"admin":8};
  function getAssignedCount(username){
    if(FIXED_COUNTS.hasOwnProperty(username)) return FIXED_COUNTS[username];
    try{
      const raw=localStorage.getItem('haisic_customers');
      if(!raw) return 0;
      const customers=JSON.parse(raw);
      if(!Array.isArray(customers)) return 0;
      let cnt=0;
      customers.forEach(function(c){
        if((c.assignedTo && c.assignedTo===username) || (c.owner && c.owner===username)) cnt++;
      });
      return cnt;
    }catch(e){ return 0 }
  }

  var ROLE_INFO={
    operator:'运营拥有系统全部权限，与超级管理员一致：可添加/管理团队成员、查看所有数据、客户自动分配。仅需分配客户即可开始跟单',
    service:'客服可查询运营工作台列表，仅可跟进已分配的客户，无法添加人员、无法进入系统设置。适合一线跟单人员。',
    admin:'系统最高权限，可管理所有成员、数据、客户分配。仅有一个，为系统初始化账号。'
  };
  function updateRoleUI(selectedRole){
    // will be exposed globally below
  }
  window.updateRoleUI = updateRoleUI;
  // re-define correctly
  updateRoleUI = function(selectedRole){
    document.querySelectorAll('.role-option').forEach(function(el){
      var r=el.getAttribute('data-role');
      if(r===selectedRole){
        el.classList.add('selected');
        el.style.borderColor='#165DFF';
        el.style.background='#F5F8FF';
        var b=el.querySelector('b'); if(b) b.style.color='#165DFF';
        var s=el.querySelector('span'); if(s) s.style.color='#5A7DF0';
      }else{
        el.classList.remove('selected');
        el.style.borderColor='#E8EBEF';
        el.style.background='#fff';
        var b2=el.querySelector('b'); if(b2) b2.style.color='#172033';
        var s2=el.querySelector('span'); if(s2) s2.style.color='#98A2B3';
      }
    });
    var infoText=document.getElementById('roleInfoText');
    if(infoText){ infoText.textContent = ROLE_INFO[selectedRole] || ROLE_INFO.operator; }
  }
  window.updateRoleUI = updateRoleUI;
  function getSelectedRole(){
    var sel=document.querySelector('.role-option.selected');
    return sel ? sel.getAttribute('data-role') : 'operator';
  }

  var editingId=null;

  function renderAccountPage(){
    const s=getSession();
    if(!s || (s.role!=='admin' && s.role!=='operator')) return;
    let a=getAccounts();
    // 运营无法查看超级管理员账户
    if(s && s.role==='operator'){ a=a.filter(function(x){return x.role!=='admin';}); }
    const grid=document.getElementById('teamGrid');
    if(!grid) return;
    grid.innerHTML=a.map(x=>{
      const isSelf=x.id===s.id;
      const status=x.enabled!==false?'normal':'disabled';
      const statusText=x.enabled!==false?'正常':'已停用';
      const assigned=getAssignedCount(x.username);
      const roleClass=x.role==='admin'?'admin':(x.role==='operator'?'operator':'service');
      const canDelete = !isSelf && x.role!=='admin';
      const initialsChar = initials(x.name);
      return '<div class="team-card '+(x.enabled===false?'is-disabled':'')+'">'
        +'<div class="team-card-top">'
          +'<div class="team-av-name">'
            +'<div class="team-avatar">'+escapeHtml(initialsChar)+'</div>'
            +'<div><div class="team-name-row"><b>'+escapeHtml(x.name)+'</b><span class="role-badge '+roleClass+'">'+(ROLE_LABEL[x.role]||x.role)+'</span></div><div class="team-id">ID: '+escapeHtml(x.username)+'</div></div>'
          +'</div>'
          +'<div class="team-actions">'
            +'<button class="team-icon-btn" data-edit="'+x.id+'" title="编辑" onclick="window.openMemberModal && window.openMemberModal(\\''+x.id+'\\')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>'
            +(canDelete?'<button class="team-icon-btn danger" data-delete="'+x.id+'" title="删除" onclick="window.deleteMember && window.deleteMember(\\''+x.id+'\\')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>':'')
          +'</div>'
        +'</div>'
        +'<div class="team-card-bottom" style="justify-content:flex-end">'
          +'<span class="status-badge '+status+'">'+statusText+'</span>'
        +'</div>'
      +'</div>';
    }).join('');
    grid.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.onclick=function(){ openMemberModal(btn.getAttribute('data-edit')); };
    });
    grid.querySelectorAll('[data-delete]').forEach(btn=>{
      btn.onclick=function(){
        const id=btn.getAttribute('data-delete');
        if(window.haisicConfirm){ window.haisicConfirm('确定删除这个成员吗？', function(){ const cur=getAccounts(); saveAccounts(cur.filter(function(x){return x.id!==id})); renderAccountPage(); }); return; }
        const cur=getAccounts(); saveAccounts(cur.filter(function(x){return x.id!==id})); renderAccountPage();
      };
    });
  }

  window.openMemberModal = function(id){
    editingId=id||null;
    const modal=document.getElementById('memberModal');
    const title=document.getElementById('memberModalTitle');
    const nameInput=document.getElementById('memberName');
    const userInput=document.getElementById('memberUsername');
    const passInput=document.getElementById('memberPassword');
    const passRow=document.getElementById('memberPasswordRow');
    const saveBtn=document.getElementById('memberModalSave');
    if(!modal) return;
    const statusEl=document.getElementById('memberStatus');
    if(statusEl) statusEl.textContent='';
      try{
        var _pwd=document.getElementById('memberPassword'); if(_pwd) _pwd.type='password';
        var _eo=document.getElementById('eyeOpen'); var _ec=document.getElementById('eyeClosed');
        if(_eo) _eo.style.display='block'; if(_ec) _ec.style.display='none';
        var _eye=document.getElementById('togglePasswordEye'); if(_eye) _eye.style.color='#98A2B3';
      }catch(e){}
    if(editingId){
      const list=getAccounts();
      const item=list.find(x=>x.id===editingId);
      if(item){
        // 运营无法查看/编辑超级管理员账户
        const _cur=getSession();
        if(_cur && _cur.role==='operator' && item.role==='admin'){
          if(statusEl){statusEl.style.color='#F04438'; statusEl.textContent='无权限查看超级管理员账户';}
          alert('运营账号无权限查看超级管理员账户');
          return;
        }
        if(title) title.textContent='编辑成员';
        if(saveBtn) saveBtn.textContent='确认保存';
        if(nameInput) nameInput.value=item.name||'';
        if(userInput) userInput.value=item.username||'';
        if(passRow) { passRow.style.display='block'; if(passInput){ passInput.value=item.password||''; passInput.placeholder='留空则保留原密码，不修改'; } var _hint=document.getElementById('memberPasswordHint'); if(_hint){ _hint.textContent='当前密码已填充，可点击眼睛查看明文，修改后保存将覆盖原密码，留空则不修改'; _hint.style.display='block'; } }
        const roleToSelect = item.role==='admin' ? 'operator' : item.role;
        updateRoleUI(roleToSelect);
      }
    }else{
      if(title) title.textContent='添加团队成员';
      if(saveBtn) saveBtn.textContent='确认添加';
      if(nameInput) nameInput.value='';
      if(userInput) userInput.value='';
      const defaultPwd = '000000'; // 按需求改为000，实际用6位000000满足校验
      if(passInput){ passInput.value='000000'; passInput.placeholder='默认密码 000000'; }
      if(passRow) passRow.style.display='block';
      var _hint2=document.getElementById('memberPasswordHint'); if(_hint2) _hint2.style.display='none';
      updateRoleUI('operator');
    }
    modal.style.display='flex';
  };
  window.closeMemberModal = function(){
    const modal=document.getElementById('memberModal');
    if(modal) modal.style.display='none';
    editingId=null;
  };

  window.deleteMember = function(id){
    if(!id) return;
    try{
      const _curS=getSession();
      const _curList=getAccounts();
      const _target=_curList.find(function(x){return x.id===id;});
      if(_curS && _curS.role==='operator' && _target && _target.role==='admin'){ alert('无权限删除超级管理员账户'); return; }
    }catch(e){}
    if(window.haisicConfirm){ window.haisicConfirm('确定删除这个成员吗？', function(){ window.deleteMemberConfirmed && window.deleteMemberConfirmed(id); }); return; }
    window.deleteMemberConfirmed=function(memberId){
    try{
      const cur = getAccounts();
      const filtered = cur.filter(function(a){ return a.id !== memberId; });
      saveAccounts(filtered);
      renderAccountPage();
      if(typeof showToast==='function') showToast('已删除');
    }catch(e){
      console.error(e);
      alert('删除失败: '+e.message);
    }
    };
    window.deleteMemberConfirmed(id);
  };

  window.saveMember = function(){
    const name=(document.getElementById('memberName').value||'').trim();
    const username=(document.getElementById('memberUsername').value||'').trim();
    const password=document.getElementById('memberPassword').value||'';
    const role=getSelectedRole();
    const statusEl=document.getElementById('memberStatus');
    if(!name || !username){ if(statusEl){statusEl.style.color='#F04438'; statusEl.textContent='请填写姓名和账号';} return; }
    const list=getAccounts();
    if(editingId){
      const item=list.find(x=>x.id===editingId);
      if(!item) return;
      if(list.some(x=>x.id!==editingId && x.username.toLowerCase()===username.toLowerCase())){
        if(statusEl){statusEl.style.color='#F04438'; statusEl.textContent='账号已存在';} return;
      }
      item.name=name; item.username=username; if(item.role!=='admin') item.role=role;
      if(password){ if(password.length<3){ if(statusEl){statusEl.style.color='#F04438'; statusEl.textContent='密码至少3位';} return; } item.password=password; }
      saveAccounts(list);
      if(statusEl){statusEl.style.color='#0E9F6E'; statusEl.textContent='已保存';}
      setTimeout(()=>{closeMemberModal(); renderAccountPage();}, 400);
    }else{
      if(password.length<3){ if(statusEl){statusEl.style.color='#F04438'; statusEl.textContent='密码至少3位';} return; }
      if(list.some(x=>x.username.toLowerCase()===username.toLowerCase())){
        if(statusEl){statusEl.style.color='#F04438'; statusEl.textContent='账号已存在';} return;
      }
      list.push({id:'acct_'+Date.now(),name,username,password,role,enabled:true,createdAt:new Date().toISOString()});
      saveAccounts(list);
      if(statusEl){statusEl.style.color='#0E9F6E'; statusEl.textContent='创建成功';}
      setTimeout(()=>{closeMemberModal(); renderAccountPage();}, 400);
    }
  };

  function setup(){
    getAccounts();
    const loginBtn=document.getElementById('loginBtn');
    const up=document.getElementById('loginPassword');
    if(loginBtn) loginBtn.onclick=login;
    if(up) up.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
    const menu=document.getElementById('accountSettingsMenu');
    if(menu) menu.addEventListener('click',function(){
      const s=getSession(); if(!s||s.role!=='admin'){return}
      document.querySelectorAll('.menu-item').forEach(i=>i.classList.remove('active'));
      menu.classList.add('active');
      if(typeof activePage!=='undefined') activePage='account-settings';
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      const page=document.getElementById('page-account-settings'); if(page) page.classList.add('active');
      const pt=document.getElementById('pageTitle'), ps=document.getElementById('pageSub');
      if(pt)pt.textContent='系统设置'; if(ps)ps.textContent='账户管理 · 角色权限 · 系统访问控制';
      renderAccountPage();
      if(window.history&&window.location.protocol!=='file:'&&window.history.pushState)history.pushState({},'', '/system-settings');
    });
    const originalSwitch=window.switchPage;
    if(typeof originalSwitch==='function'){
      window.switchPage=function(page){
        const s=getSession();
        if(s){
          const allowed=ROLE_PAGES[s.role]||[];
          if(page && !allowed.includes(page)){
            const fallback=allowed[0]||'ops';
            if(page!==fallback){
              if(typeof showToast==='function') showToast('无权限访问，已返回首页');
              return originalSwitch(fallback);
            }
          }
        }
        if(page==='account-settings'){
          const ss=getSession(); if(!ss||(ss.role!=='admin' && ss.role!=='operator')) {
            const fb=(ROLE_PAGES[ss?ss.role:'operator']||['ops'])[0]||'ops';
            return originalSwitch(fb);
          }
          document.querySelectorAll('.menu-item').forEach(i=>i.classList.remove('active'));
          if(menu)menu.classList.add('active');
          if(typeof activePage!=='undefined')activePage=page;
          document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
          const pg=document.getElementById('page-account-settings');
          if(pg) pg.classList.add('active');
          const pt=document.getElementById('pageTitle');
          const ps=document.getElementById('pageSub');
          if(pt)pt.textContent='系统设置';
          if(ps)ps.textContent='账户管理 · 角色权限 · 系统访问控制';
          renderAccountPage();
          return;
        }
        originalSwitch(page);
        const ss=getSession(); if(ss) applyPermissions(ss);
      };
    }
    // 弹窗绑定
    document.addEventListener('DOMContentLoaded', function(){
      const addBtn=document.getElementById('openAddMemberBtn');
      if(addBtn) addBtn.onclick=function(){openMemberModal(null);};
      const closeBtn=document.getElementById('memberModalClose');
      if(closeBtn) closeBtn.onclick=closeMemberModal;
      const cancelBtn=document.getElementById('memberModalCancel');
      if(cancelBtn) cancelBtn.onclick=closeMemberModal;
      const saveBtn=document.getElementById('memberModalSave');
      if(saveBtn) saveBtn.onclick=saveMember;
      const overlay=document.getElementById('memberModal');
      if(overlay) overlay.addEventListener('click', function(e){ if(e.target===overlay) closeMemberModal(); });
      document.querySelectorAll('.role-option').forEach(function(el){
        el.addEventListener('click', function(){ updateRoleUI(el.getAttribute('data-role')); });
      });
    });
    // 立即绑定（防止 DOMContentLoaded 已触发）
    setTimeout(function(){
      const addBtn=document.getElementById('openAddMemberBtn');
      if(addBtn) addBtn.onclick=function(){openMemberModal(null);};
    }, 300);

    const s=getSession();
    if(s) showApp(); else showLogin('');
  }

  window.HaisicAuth={getAccounts,saveAccounts,renderAccountPage,logout,applyPermissions,ROLE_PAGES,ROLE_LABEL,ROLE_NOTE};

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',setup);
  else setup();
})();
<\/script>

<script>
/* Unified in-app notice modal; replaces the browser's unstyled top alert. */
(function(){
  var pending=[];
  function ensureNotice(){
    var overlay=document.getElementById('haisicNoticeOverlay');
    if(overlay) return overlay;
    overlay=document.createElement('div');
    overlay.id='haisicNoticeOverlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-labelledby','haisicNoticeTitle');
    overlay.innerHTML='<div class="haisic-notice-card"><div class="haisic-notice-icon" id="haisicNoticeIcon">!</div><div class="haisic-notice-copy"><b id="haisicNoticeTitle">操作提示</b><p id="haisicNoticeMessage"></p></div><button id="haisicNoticeOk" type="button">知道了</button></div>';
    document.body.appendChild(overlay);
    function close(){overlay.classList.remove('show');setTimeout(function(){if(pending.length) showNotice(pending.shift());},160);}
    overlay.querySelector('#haisicNoticeOk').onclick=close;
    overlay.addEventListener('click',function(e){if(e.target===overlay) close();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&overlay.classList.contains('show'))close();});
    return overlay;
  }
  function showNotice(message){
    var overlay=ensureNotice();
    if(overlay.classList.contains('show')){pending.push(message);return;}
    var text=String(message||'');
    var type=/失败|错误|无效|未连接|尚未|请先|不能|无法/.test(text)?'warning':(/成功|完成|已保存|已连接/.test(text)?'success':'info');
    overlay.className='haisic-notice-overlay '+type;
    overlay.querySelector('#haisicNoticeTitle').textContent=type==='success'?'操作成功':type==='warning'?'需要处理':'操作提示';
    overlay.querySelector('#haisicNoticeMessage').textContent=text;
    overlay.querySelector('#haisicNoticeIcon').textContent=type==='success'?'✓':type==='warning'?'!':'i';
    requestAnimationFrame(function(){overlay.classList.add('show');overlay.querySelector('#haisicNoticeOk').focus();});
  }
  window.haisicNotice=showNotice;
  window.alert=showNotice;
  window.haisicConfirm=function(message,onConfirm){
    var overlay=ensureNotice();
    if(overlay.classList.contains('show')) return;
    overlay.className='haisic-notice-overlay warning';
    overlay.querySelector('#haisicNoticeTitle').textContent='确认操作';
    overlay.querySelector('#haisicNoticeMessage').textContent=String(message||'');
    overlay.querySelector('#haisicNoticeIcon').textContent='!';
    var ok=overlay.querySelector('#haisicNoticeOk');
    ok.textContent='确定';
    var cancel=document.getElementById('haisicNoticeCancel');
    if(!cancel){cancel=document.createElement('button');cancel.id='haisicNoticeCancel';cancel.type='button';cancel.textContent='取消';ok.parentNode.insertBefore(cancel,ok);}
    cancel.style.display='inline-flex';
    cancel.onclick=function(){overlay.classList.remove('show');cancel.style.display='none';ok.textContent='知道了';};
    ok.onclick=function(){overlay.classList.remove('show');cancel.style.display='none';ok.textContent='知道了';if(typeof onConfirm==='function')setTimeout(onConfirm,160);};
    requestAnimationFrame(function(){overlay.classList.add('show');ok.focus();});
  };
})();
