function removeProductFile(idx){
  if(!window._productFiles) window._productFiles=[];
  if(!window._productFileContents) window._productFileContents=[];
  if(!window._productFileProgress) window._productFileProgress=[];
  const wasSelected = window._selectedProductFileIndex===idx;
  window._productFiles.splice(idx,1);
  window._productFileContents.splice(idx,1);
  window._productFileProgress.splice(idx,1);
  const listEl=document.getElementById('productFileList');
  const customNameEl=document.getElementById('customFileName');
  const fileInput=document.getElementById('productFileInput');
  const extractEl=document.getElementById('productExtractResult');
  
  if(window._productFiles.length===0){
    if(listEl) listEl.innerHTML='';
    if(customNameEl){ customNameEl.textContent='未选择任何文件'; customNameEl.style.color='#86909C'; }
    if(fileInput) fileInput.value='';
    if(extractEl){ extractEl.style.display='none'; extractEl.dataset.everShown=''; }
    window.productExtractDraft=null;
    window._selectedProductFileIndex=null;
    window._productFiles=[];
    window._productFileContents=[];
    window._productFileProgress=[];
  } else {
    if(wasSelected){
      window._selectedProductFileIndex=null;
      if(extractEl){ extractEl.style.display='none'; extractEl.dataset.everShown=''; }
      window.productExtractDraft=null;
    } else if(window._selectedProductFileIndex!==null && window._selectedProductFileIndex>idx){
      window._selectedProductFileIndex--;
    }
    renderProductFileList();
    if(customNameEl){
      if(window._productFiles.length===1){ customNameEl.textContent=window._productFiles[0].name; customNameEl.style.color='#1D2129'; }
      else { customNameEl.textContent=\`已选择 \${window._productFiles.length} 个文件\`; customNameEl.style.color='#1D2129'; }
    }
  }
}



function extractProductInfoFromText(text){
  const res={models:'',specs:'',inv5k:null,inv10k:null,bat5k:null,moq:null,tiered:'',sample:'',bulk:'',warehouse:'',sea:'',warrantyInv:'',warrantyBat:'',certs:'',efficiency:'',cycles:'',ip:'',lifespan:'',payment:'',powerRange:'',capacityRange:'',dod:'',kwList:[],kwhList:[],brand:'HaiSic',brandZh:'海思',brandEn:'HaiSic'};
  const t=text;

  // 一、文件提取新增品牌字段 - 自动识别中英文品牌名
  const knownBrandsMap = {
    'HaiSic': {zh:'海思', en:'HaiSic'},
    'Haisic': {zh:'海思', en:'HaiSic'},
    'Deye': {zh:'德业', en:'Deye'},
    'Growatt': {zh:'古瑞瓦特', en:'Growatt'},
    'Solis': {zh:'锦浪', en:'Solis'},
    'GoodWe': {zh:'固德威', en:'GoodWe'},
    'SMA': {zh:'SMA', en:'SMA'},
    'Fronius': {zh:'伏能士', en:'Fronius'},
    'Huawei': {zh:'华为', en:'Huawei'},
    'BYD': {zh:'比亚迪', en:'BYD'},
    'Pylontech': {zh:'派能', en:'Pylontech'},
    'Dyness': {zh:'动力源', en:'Dyness'},
    'Apex': {zh:'Apex', en:'Apex'},
    'Sungrow': {zh:'阳光电源', en:'Sungrow'},
    'Solax': {zh:'艾罗', en:'Solax'}
  };

  // 优先匹配 Brand/Company 字段
  const brandPatterns = [
    /Brand\\s*[:：]\\s*([A-Za-z0-9\\s&]{2,30})/i,
    /Company\\s*[:：]\\s*([A-Za-z0-9\\s&]{2,30})/i,
    /Manufacturer\\s*[:：]\\s*([A-Za-z0-9\\s&]{2,30})/i,
    /品牌\\s*[:：]\\s*([\\u4e00-\\u9fa5A-Za-z0-9]{2,20})/,
    /公司\\s*[:：]\\s*([\\u4e00-\\u9fa5A-Za-z0-9]{2,20})/,
    /厂商\\s*[:：]\\s*([\\u4e00-\\u9fa5A-Za-z0-9]{2,20})/
  ];

  let detectedBrandEn = null;
  let detectedBrandZh = null;

  for(const pat of brandPatterns){
    const bm=t.match(pat);
    if(bm && bm[1]){
      const bRaw=bm[1].trim().split(/\\n|\\r|\\s{2,}|\\(|\\（/)[0].trim().slice(0,30);
      if(bRaw.length>=2){
        // 判断中英文
        if(/[\\u4e00-\\u9fa5]/.test(bRaw)){
          detectedBrandZh = bRaw;
          // 尝试映射英文
          for(const key in knownBrandsMap){
            if(knownBrandsMap[key].zh===bRaw){
              detectedBrandEn = knownBrandsMap[key].en;
              break;
            }
          }
          if(!detectedBrandEn) detectedBrandEn = bRaw; // 暂用中文作为英文
        } else {
          detectedBrandEn = bRaw;
          // 尝试映射中文
          for(const key in knownBrandsMap){
            if(key.toLowerCase()===bRaw.toLowerCase()){
              detectedBrandZh = knownBrandsMap[key].zh;
              detectedBrandEn = knownBrandsMap[key].en;
              break;
            }
          }
          if(!detectedBrandZh){
            // 未知英文品牌，中文暂用英文
            detectedBrandZh = bRaw;
          }
        }
        break;
      }
    }
  }

  // 已知品牌库扫描 - 高频出现
  if(!detectedBrandEn){
    for(const key in knownBrandsMap){
      const count = (t.match(new RegExp(key, 'gi'))||[]).length;
      if(count>=2){
        detectedBrandEn = knownBrandsMap[key].en;
        detectedBrandZh = knownBrandsMap[key].zh;
        break;
      }
    }
  }

  // 文件名包含品牌
  if(!detectedBrandEn){
    const fileNamePart = text.slice(-500);
    for(const key in knownBrandsMap){
      if(fileNamePart.toLowerCase().includes(key.toLowerCase())){
        detectedBrandEn = knownBrandsMap[key].en;
        detectedBrandZh = knownBrandsMap[key].zh;
        break;
      }
    }
  }

  if(detectedBrandEn){
    res.brandEn = detectedBrandEn;
    res.brandZh = detectedBrandZh || detectedBrandEn;
    res.brand = detectedBrandEn; // 默认英文品牌作为主品牌
  }

  // 产品型号
  const modelPat=/\\b(?:HAI|HBP|HSI|HES|HSE|DEYE|SG|SUN|BAT)[-_]?[A-Z0-9]+\\b/gi;
  const mm=t.match(modelPat);
  if(mm) res.models=[...new Set(mm.map(m=>m.toUpperCase()))].slice(0,8).join(', ');
  const modelLine=t.match(/(?:产品型号|型号|Model|Models|Product model)\\s*[:：]\\s*([^\\n]{2,120})/i);
  if(modelLine && !res.models) res.models=modelLine[1].trim().slice(0,120);

  const powerRanges=t.match(/\\b\\d+(?:\\.\\d+)?\\s*kW\\s*[-–]\\s*\\d+(?:\\.\\d+)?\\s*kW\\b/gi);
  const capRanges=t.match(/\\b\\d+(?:\\.\\d+)?\\s*kWh\\s*[-–]\\s*\\d+(?:\\.\\d+)?\\s*kWh\\b/gi);
  const kwSingle=t.match(/\\b\\d+(?:\\.\\d+)?\\s*kW\\b/gi);
  const kwhSingle=t.match(/\\b\\d+(?:\\.\\d+)?\\s*kWh\\b/gi);
  if(powerRanges && powerRanges[0]) res.powerRange=powerRanges[0];
  if(capRanges && capRanges[0]) res.capacityRange=capRanges[0];
  if(kwSingle) res.kwList=[...new Set(kwSingle.map(s=>s.toUpperCase()))].slice(0,6);
  if(kwhSingle) res.kwhList=[...new Set(kwhSingle.map(s=>s.toUpperCase()))].slice(0,6);

  const effEn=t.match(/\\b\\d+(?:\\.\\d+)?%\\s*(?:max\\s*)?efficiency\\b/gi);
  const effZh=t.match(/转换效率[^\\n]{0,20}(\\d+(?:\\.\\d+)?%)/i);
  const effGeneric=t.match(/\\b(?:97\\.6%|98(?:\\.\\d+)?%|\\d{2}\\.\\d+%)/g);
  if(effEn) res.efficiency=effEn[0];
  else if(effZh) res.efficiency=effZh[1];
  else if(effGeneric) res.efficiency=effGeneric[0];

  const cycEn=t.match(/\\b\\d+,?\\d*\\s*cycles\\b/gi);
  const cycZh=t.match(/循环次数[^\\n]{0,20}(\\d+,?\\d*)/i);
  if(cycEn) res.cycles=cycEn[0];
  else if(cycZh) res.cycles=cycZh[1]+'次';
  else if(t.match(/6000/)) res.cycles='6000 cycles';

  const dod=t.match(/\\b\\d+%\\s*DOD\\b/gi);
  if(dod) res.dod=dod[0];

  const ip=t.match(/\\bIP\\d+\\b/gi);
  const ipZh=t.match(/防护等级[^\\n]{0,20}(IP\\d+)/i);
  if(ip) res.ip=[...new Set(ip.map(x=>x.toUpperCase()))].join(', ');
  else if(ipZh) res.ip=ipZh[1].toUpperCase();

  const wInv=t.match(/inverter[^\\n]{0,40}(\\d+\\s*years?)/i) || t.match(/逆变器[^\\n]{0,20}(\\d+年)/i);
  if(wInv) res.warrantyInv=wInv[1];
  const wBat=t.match(/battery[^\\n]{0,60}(\\d+\\s*years?)/i) || t.match(/电池[^\\n]{0,20}(\\d+年)/i);
  if(wBat) res.warrantyBat=wBat[1];
  const life=t.match(/\\b\\d+(?:-\\d+)?\\s*years?\\s*lifespan\\b/gi) || t.match(/寿命[^\\n]{0,20}(\\d+年)/i);
  if(life) res.lifespan=Array.isArray(life)?life[0]:life;

  const priceMatches=[...t.matchAll(/\\$\\s*(\\d{3,5})/g)].map(m=>parseInt(m[1])).filter(n=>n>=100&&n<=20000);
  const m5=t.match(/5\\s*kW[^$]{0,80}\\$\\s*(\\d{3,5})/i) || t.match(/5kW[^\\n]{0,30}单价[^\\n]{0,20}(\\d{3,5})/i);
  const m10=t.match(/10\\s*kW[^$]{0,80}\\$\\s*(\\d{3,5})/i) || t.match(/10kW[^\\n]{0,30}单价[^\\n]{0,20}(\\d{3,5})/i);
  const mb=t.match(/5\\s*kWh[^$]{0,80}\\$\\s*(\\d{3,5})/i) || t.match(/5kWh[^\\n]{0,30}单价[^\\n]{0,20}(\\d{3,5})/i) || t.match(/电池[^\\n]{0,20}单价[^\\n]{0,20}(\\d{3,5})/i);
  const unitPriceZh=t.match(/单价[^\\n]{0,30}(\\d{3,5})/i);
  const unitPriceEn=t.match(/unit price[^\\n]{0,30}\\$?\\s*(\\d{3,5})/i);
  if(m5) res.inv5k=parseInt(m5[1]);
  if(m10) res.inv10k=parseInt(m10[1]);
  if(mb) res.bat5k=parseInt(mb[1]);
  if(!res.inv5k && unitPriceZh) res.inv5k=parseInt(unitPriceZh[1]);
  if(!res.inv5k && unitPriceEn) res.inv5k=parseInt(unitPriceEn[1]);
  if(!res.inv5k && priceMatches[0]) res.inv5k=priceMatches[0];
  if(!res.inv10k && priceMatches[1]) res.inv10k=priceMatches[1];
  if(!res.bat5k && priceMatches[2]) res.bat5k=priceMatches[2];

  const moqEn=t.match(/MOQ\\s*[:：]?\\s*(\\d+)/i);
  const moqZh=t.match(/起订量[^\\n]{0,20}(\\d+)/i);
  if(moqEn) res.moq=parseInt(moqEn[1]);
  else if(moqZh) res.moq=parseInt(moqZh[1]);

  const tierEn=t.match(/\\d+\\+\\s*\\d+%\\s*off[^\\n]{0,80}/i) || t.match(/tiered pricing[^\\n]{0,80}/i);
  const tierZh=t.match(/阶梯价[^\\n]{0,80}|批量[^\\n]{0,20}优惠[^\\n]{0,80}/i);
  if(tierEn) res.tiered=tierEn[0];
  else if(tierZh) res.tiered=tierZh[0] || '10+ 2% off, 20+ 4% off';

  const sampleEn=t.match(/(?:sample|样品交期)[^\\n]{0,30}(\\d+[-–]\\d+\\s*days)/i) || t.match(/样品[^\\n]{0,20}(\\d+[-–]\\d+天)/i);
  const bulkEn=t.match(/(?:bulk|production|批量交期|lead time|delivery time)[^\\n]{0,40}(\\d+[-–]\\d+\\s*days)/i) || t.match(/交期[^\\n]{0,20}(\\d+[-–]\\d+天)/i);
  const seaEn=t.match(/sea freight[^\\n]{0,40}(\\d+[-–]\\d+\\s*days)/i) || t.match(/海运[^\\n]{0,20}(\\d+[-–]\\d+天)/i);
  const whEn=t.match(/warehouse[^\\n]{0,40}(\\d+[-–]\\d+\\s*days)/i) || t.match(/海外仓[^\\n]{0,20}(\\d+[-–]\\d+天)/i);
  if(sampleEn) res.sample=sampleEn[1];
  if(bulkEn) res.bulk=bulkEn[1];
  if(seaEn) res.sea=seaEn[1];
  if(whEn) res.warehouse=whEn[1];

  const payEn=t.match(/payment[^\\n]{0,40}(T\\/T|L\\/C|100%|30%[^\\n]{0,30}70%)/i);
  const payZh=t.match(/付款方式[^\\n]{0,40}([^\\n]{2,30})/i);
  if(payEn) res.payment=payEn[1] || payEn[0];
  else if(payZh) res.payment=payZh[1];

  const certs=[]; ['CE','VDE4105','G98','G99','AS/NZS4777','UN38.3','CEC','UKCA','IEC62109','IEC62619','MSDS','UL','TUV'].forEach(c=>{ if(t.toUpperCase().includes(c)) certs.push(c); });
  if(certs.length) res.certs=certs.join(', ');

  const specParts=[];
  if(res.powerRange) specParts.push(res.powerRange);
  else if(res.kwList.length) specParts.push(...res.kwList.slice(0,2));
  if(res.capacityRange) specParts.push(res.capacityRange);
  else if(res.kwhList.length) specParts.push(...res.kwhList.slice(0,2));
  if(res.efficiency) specParts.push(res.efficiency);
  if(res.cycles) specParts.push(res.cycles);
  if(res.dod) specParts.push(res.dod);
  if(res.ip) specParts.push(res.ip);
  if(res.lifespan) specParts.push(res.lifespan);
  const extra=t.match(/dual MPPT|\\d+ms\\s*UPS-level|BMS|CAN\\/RS485|Grade A EVE cells/gi);
  if(extra) specParts.push(...extra.slice(0,4));
  if(specParts.length) res.specs=specParts.join(', ').slice(0,400);

  return res;
}







function toggleExtractVisibility(){
  const mode = document.querySelector('input[name="pb_mode"]:checked')?.value || 'append';
  const extractEl = document.getElementById('productExtractResult');
  if(!extractEl) return;
  if(mode==='cover'){
    // 覆盖模式：自动隐藏AI提取结果区块，内容保留不丢失
    extractEl.style.display='none';
  } else {
    // 追加模式：恢复显示，已提取/已编辑内容保留
    // 只有当有提取草稿或已显示过文件时才显示，避免空状态下突兀显示
    if(window.productExtractDraft || document.getElementById('productFileList')?.innerHTML){
      extractEl.style.display='block';
    } else {
      // 若无提取内容，保持隐藏，待上传后fillProductExtractForm会显示
      // 但按联动规则默认追加时应正常显示，这里保持逻辑：有内容则显示，无内容保持隐藏不影响
      if(extractEl.dataset.everShown==='1'){
        extractEl.style.display='block';
      }
    }
  }
}

function bindSaveModeToggle(){
  const radios = document.querySelectorAll('input[name="pb_mode"]');
  radios.forEach(r=>{
    if(!r.dataset.bound){
      r.addEventListener('change', toggleExtractVisibility);
      r.dataset.bound='1';
    }
  });
}

function fillProductExtractForm(d){
  const el=document.getElementById('productExtractResult');
  if(!el) return;
  // 标记已显示过，用于切换回追加时恢复
  el.dataset.everShown='1';
  // 根据保存方式决定显隐
  const mode = document.querySelector('input[name="pb_mode"]:checked')?.value || 'append';
  if(mode==='cover'){
    // 覆盖模式下即使有新提取也保持隐藏，内容保留
    el.style.display='none';
  } else {
    el.style.display='block';

  if(d.models) document.getElementById('pb_models').value=d.models;
  if(d.inv5k) document.getElementById('pb_inv5k').value=d.inv5k;
  if(d.inv10k) document.getElementById('pb_inv10k').value=d.inv10k;

  if(d.moq) document.getElementById('pb_moq').value=d.moq;

function startSyncFromSelectedFile(){
  const manualBrandEl = document.getElementById('manualBrandInput');
  const manualBrand = manualBrandEl ? manualBrandEl.value.trim() : '';
  const hasManualBrand = manualBrand.length>=2;
  const hasSelectedFile = !!_selectedSyncFileId;

  if(!hasManualBrand && !hasSelectedFile){
    showToast('请选择要同步的文件或输入品牌名称', 2000);
    return;
  }

  let productData = null;
  let targetLang = 'en';
  let file = null;

  if(hasSelectedFile){
    const files = loadUnifiedBase();
    file = files.find(f=> (f.fileId===_selectedSyncFileId) || (f.id===_selectedSyncFileId));
    if(!file){
      showToast('文件不存在', 2000);
      return;
    }
    productData = file.productData || file.baseData;
    targetLang = file.language || detectLanguage(file.fileName || file.name || file.content || '');
  } else {
    try{
      productData = loadProductBase() || JSON.parse(JSON.stringify(DEFAULT_PRODUCT_BASE));
    }catch(e){
      productData = JSON.parse(JSON.stringify(DEFAULT_PRODUCT_BASE));
    }
    targetLang = detectLanguage(manualBrand);
    if(!productData) productData = {};
  }

  let brandEn = productData.brandEn || productData.brand || 'HaiSic';
  let brandZh = productData.brandZh || productData.brand || '海思';
  
  if(hasManualBrand){
    if(/[\\u4e00-\\u9fa5]/.test(manualBrand)){
      brandZh = manualBrand;
      const enPart = manualBrand.match(/[A-Za-z0-9]{2,}/);
      brandEn = enPart ? enPart[0] : manualBrand;
    } else {
      brandEn = manualBrand;
      brandZh = manualBrand;
    }
    productData.brandEn = brandEn;
    productData.brandZh = brandZh;
    productData.brand = brandEn;
  }

  const targetBrand = targetLang==='zh' ? brandZh : brandEn;
  console.log('[同步] 目标语言:', targetLang, '目标品牌:', targetBrand, '全量话术强制切换');

  let scripts = getKbScripts();
  let updatedCount = 0;
  const templates = getBilingualTemplates();

  // 全量话术强制切换 - 文件什么语言，全部话术就是什么语言
  scripts = scripts.map(s=>{
    const original = s.content;
    const originalLang = detectLanguage(original);
    let newContent = original;

    // 1. 模板话术 - 强制使用目标语言模板
    const tpl = templates[s.id];
    if(tpl){
      const langTpl = targetLang==='zh' ? tpl.zh : tpl.en;
      newContent = fillTemplateWithBase(langTpl, productData);
      if(hasManualBrand){
        newContent = newContent.replace(/HaiSic/g, brandEn).replace(/海思/g, brandZh);
        // 根据目标语言替换为对应品牌
        if(targetLang==='zh'){
          newContent = newContent.replace(new RegExp(brandEn.replace(/[.*+?^\${}()|[\\]\\\\]/g, '\\\\$&'), 'g'), brandZh);
        } else {
          newContent = newContent.replace(new RegExp(brandZh.replace(/[.*+?^\${}()|[\\]\\\\]/g, '\\\\$&'), 'g'), brandEn);
        }
      }
    } else {
      // 2. 自定义话术 - 全量强制切换
      // 先执行品牌+参数替换
      const result = replaceBusinessParamsInContent(original, productData);
      newContent = result.content;

      // 判断是否需要语言切换
      const needsLangSwitch = originalLang !== targetLang;
      
      if(needsLangSwitch){
        // 根据关键词匹配模板类型，强制生成目标语言版本
        const lowerOrig = original.toLowerCase();
        let matchedTemplate = null;
        
        if(lowerOrig.match(/您好|我们是|hello|thanks|we are|主营|main models|greeting|intro/)){
          matchedTemplate = templates.intro;
        } else if(lowerOrig.match(/报价|价格|\\$|单价|quotation|unit price|price|moq|起订|tiered|阶梯/)){
          matchedTemplate = templates.price;
        } else if(lowerOrig.match(/交期|交货|样品|批量|海外仓|海运|lead time|delivery|warehouse|sea freight/)){
          matchedTemplate = templates.delivery;
        } else if(lowerOrig.match(/质保|warranty|lifespan|寿命|循环|cycles/)){
          matchedTemplate = templates.warranty;
        } else if(lowerOrig.match(/公司|厂商|brand|company|专注|focusing|trusted|值得信赖/)){
          matchedTemplate = templates.company;
        } else {
          // 未匹配到具体类型，默认为intro类型，确保语言切换
          matchedTemplate = templates.intro;
        }

        if(matchedTemplate){
          const langTpl = targetLang==='zh' ? matchedTemplate.zh : matchedTemplate.en;
          let tplContent = fillTemplateWithBase(langTpl, productData);
          if(hasManualBrand){
            tplContent = tplContent.replace(/HaiSic/g, brandEn).replace(/海思/g, brandZh);
            if(targetLang==='zh'){
              tplContent = tplContent.replace(new RegExp(brandEn.replace(/[.*+?^\${}()|[\\]\\\\]/g, '\\\\$&'), 'g'), brandZh);
            }
          }
          newContent = tplContent;
        } else {
          // 极端情况：无法匹配模板，执行简单的中英文关键词翻译，确保语言一致
          if(targetLang==='zh'){
            // 英文转中文 - 基础翻译
            newContent = newContent.replace(/Hello!\\s*Thanks for reaching out to\\s*[^.,!\\n]{2,30}/gi, \`您好，我们是 \${brandZh}\`);
            newContent = newContent.replace(/Thanks for reaching out to\\s*[^.,!\\n]{2,30}/gi, \`感谢咨询 \${brandZh}\`);
            newContent = newContent.replace(/Hello, we are\\s*[^,\\n]{2,40}/gi, \`您好，我们是 \${brandZh}\`);
            newContent = newContent.replace(/We are\\s+[^,\\n!.]{2,30}/gi, \`我们是 \${brandZh}\`);
            newContent = newContent.replace(/Quotation:/gi, '报价：');
            newContent = newContent.replace(/Lead time:/gi, '交期：');
            newContent = newContent.replace(/Warranty:/gi, '质保：');
            newContent = newContent.replace(/Payment/gi, '付款方式');
            newContent = newContent.replace(/Inverter/gi, '逆变器');
            newContent = newContent.replace(/Battery/gi, '电池');
            newContent = newContent.replace(/MOQ/gi, '起订量 MOQ');
            newContent = newContent.replace(/tiered pricing/gi, '阶梯价');
            newContent = newContent.replace(/sample/gi, '样品');
            newContent = newContent.replace(/bulk/gi, '批量');
            newContent = newContent.replace(/warehouse/gi, '海外仓');
            newContent = newContent.replace(/sea freight/gi, '海运');
          } else {
            // 中文转英文
            newContent = newContent.replace(/您好，我们是[^，,。\\n]{2,30}/gi, \`Hello, we are \${brandEn}\`);
            newContent = newContent.replace(/感谢咨询[^，,。\\n]{2,30}/gi, \`Thanks for reaching out to \${brandEn}\`);
            newContent = newContent.replace(/我们是[^，,。\\n]{2,30}/gi, \`We are \${brandEn}\`);
            newContent = newContent.replace(/报价：/gi, 'Quotation: ');
            newContent = newContent.replace(/交期：/gi, 'Lead time: ');
            newContent = newContent.replace(/质保：/gi, 'Warranty: ');
            newContent = newContent.replace(/付款方式/gi, 'Payment');
            newContent = newContent.replace(/逆变器/gi, 'Inverter');
            newContent = newContent.replace(/电池/gi, 'Battery');
            newContent = newContent.replace(/起订量/g, 'MOQ');
            newContent = newContent.replace(/阶梯价/g, 'tiered pricing');
            newContent = newContent.replace(/样品交期/g, 'sample lead time');
            newContent = newContent.replace(/批量交期/g, 'bulk lead time');
            newContent = newContent.replace(/海外仓/g, 'overseas warehouse');
            newContent = newContent.replace(/海运/g, 'sea freight');
          }
        }
      }

      // 手动品牌输入时，强制替换所有自我介绍句
      if(hasManualBrand){
        if(/[\\u4e00-\\u9fa5]/.test(newContent)){
          newContent = newContent.replace(/我们是[^，,。\\n!]{2,30}/gi, \`我们是 \${brandZh}\`);
          newContent = newContent.replace(/我是[^，,。\\n!]{2,30}/gi, \`我是 \${brandZh}\`);
        }
        if(/[a-zA-Z]/.test(newContent)){
          newContent = newContent.replace(/we are\\s+[^,\\n!.]{2,30}/gi, \`we are \${brandEn}\`);
          newContent = newContent.replace(/reaching out to\\s*[^.,!\\n]{2,30}/gi, \`reaching out to \${brandEn}\`);
        }
      }
    }

    // 全部更新 - 只要语言不同或内容不同，都算更新
    if(newContent !== original || s.language !== targetLang){
      updatedCount++;
      return {...s, content:newContent, updatedAt:new Date().toISOString(), language:targetLang};
    } else {
      // 即使内容相同，也强制语言为目标语言，并计入更新（全量更新）
      updatedCount++;
      return {...s, content:newContent, updatedAt:new Date().toISOString(), language:targetLang};
    }
  });

  // 空话术时创建
  if(scripts.length===0){
    Object.keys(templates).forEach(key=>{
      const tpl = templates[key];
      const content = targetLang==='zh' ? tpl.zh : tpl.en;
      let finalContent = fillTemplateWithBase(content, productData);
      if(hasManualBrand){
        finalContent = finalContent.replace(/HaiSic/g, brandEn).replace(/海思/g, brandZh);
      }
      scripts.push({
        id: key,
        title: key,
        content: finalContent,
        language: targetLang,
        updatedAt: new Date().toISOString()
      });
    });
    updatedCount = scripts.length;
  }

  saveKbScripts(scripts);
  if(typeof renderKB==='function') renderKB();
  closeSyncFileSelector(); resetAutoOptimizeTimer();

  // 全部更新反馈
  if(hasManualBrand && file){
    showToast(\`同步完成，已切换为\${targetLang==='zh'?'中文':'英文'}话术，品牌名与产品参数已全部更新\`, 2000);
  } else if(hasManualBrand){
    showToast(\`同步完成，品牌名已全部更新为 \${targetBrand}\`, 2000);
  } else {
    showToast(\`同步完成，已切换为\${targetLang==='zh'?'中文':'英文'}话术，已全部更新 \${updatedCount} 条\`, 2000);
  }
}

function syncProductFiles(){
  try{
    if(!window._productFiles || window._productFiles.length===0){
      showToast('请先选择要保存的文件', 2000);
      return;
    }

    const mode=document.querySelector('input[name="pb_mode"]:checked')?.value||'append';
    let unifiedBase = loadUnifiedBase();
    if(mode==='cover'){
      unifiedBase = [];
    }

    const newRecords=[];
    window._productFiles.forEach((file, idx)=>{
      const content = window._productFileContents && window._productFileContents[idx] ? window._productFileContents[idx] : '';
      if(!content) return;
      let extracted;
      try{ extracted = extractProductInfoFromText(content); }catch(e){ return; }
      if(!extracted) return;

      let productData = JSON.parse(JSON.stringify(DEFAULT_PRODUCT_BASE));
      if(extracted.models) productData.models=extracted.models;
      if(extracted.specs) productData.specs=extracted.specs;
      if(extracted.inv5k) productData.pricing.inv5k=extracted.inv5k;
      if(extracted.inv10k) productData.pricing.inv10k=extracted.inv10k;
      if(extracted.bat5k) productData.pricing.bat5k=extracted.bat5k;
      if(extracted.moq) productData.pricing.moq=extracted.moq;
      if(extracted.tiered) productData.pricing.tiered=extracted.tiered;
      if(extracted.sample) productData.delivery.sample=extracted.sample;
      if(extracted.bulk) productData.delivery.bulk=extracted.bulk;
      if(extracted.warehouse) productData.delivery.warehouse=extracted.warehouse;
      if(extracted.sea) productData.delivery.sea=extracted.sea;
      if(extracted.warrantyInv) productData.warranty.inverter=extracted.warrantyInv;
      if(extracted.warrantyBat) productData.warranty.battery=extracted.warrantyBat;
      if(extracted.certs) productData.certs=extracted.certs;
      if(extracted.efficiency) productData.efficiency=extracted.efficiency;
      if(extracted.cycles) productData.cycles=extracted.cycles;
      if(extracted.ip) productData.ip=extracted.ip;
      if(extracted.payment) productData.payment=extracted.payment;
      if(extracted.powerRange) productData.powerRange=extracted.powerRange;
      if(extracted.capacityRange) productData.capacityRange=extracted.capacityRange;

      const formModels=document.getElementById('pb_models')?.value.trim();
      const formSpecs=document.getElementById('pb_specs')?.value.trim();
      if(formModels) productData.models=formModels;
      if(formSpecs) productData.specs=formSpecs;

      const lang = detectLanguage(content || file.name);

      const record = {
        fileId: 'fid_'+Date.now()+'_'+idx+'_'+Math.random().toString(36).slice(2,5),
        fileName: file.name,
        fileSize: file.size,
        language: lang,
        productData: productData,
        saveTime: new Date().toISOString(),
        id: 'fid_'+Date.now()+'_'+idx,
        name: file.name,
        size: file.size,
        baseData: productData,
        extracted: extracted,
        content: content.slice(0,50000),
        savedAt: new Date().toISOString()
      };
      newRecords.push(record);
    });

    if(newRecords.length===0){
      showToast('保存失败，请检查文件后重试', 2000);
      return;
    }

    if(mode==='append'){
      newRecords.forEach(newRec=>{
        const sameIdx = unifiedBase.findIndex(r=>r.fileName===newRec.fileName || r.name===newRec.fileName);
        if(sameIdx>=0) unifiedBase[sameIdx]=newRec;
        else unifiedBase.unshift(newRec);
      });
    } else {
      unifiedBase = [...newRecords];
    }

    if(unifiedBase.length>30) unifiedBase.splice(30);
    saveUnifiedBase(unifiedBase);

    try{
      let mergedBase = JSON.parse(JSON.stringify(DEFAULT_PRODUCT_BASE));
      if(unifiedBase[0]?.productData){
        mergedBase = unifiedBase[0].productData;
      }
      saveProductBase(mergedBase);
      if(typeof renderProductBaseCurrent==='function') renderProductBaseCurrent();
    }catch(e){}

    closeProductUploadModal();

  }catch(e){
    console.error('[保存失败]', e);
    showToast('保存失败，请检查文件后重试', 2000);
  }
}









function refreshKbPage(){
  setTimeout(()=>{
    try{
      const base = loadProductBase();
      if(!base || !base.updatedAt){
        if(typeof renderKB === 'function') renderKB();
        showToast('基准库暂无结构化产品数据，请检查文件提取结果', 2000);
        return;
      }
      const hasFields = (base.models && base.models.trim()) || (base.specs && base.specs.trim()) || base.pricing.inv5k || base.pricing.moq || base.certs;
      if(!hasFields){
        if(typeof renderKB === 'function') renderKB();
        showToast('基准库暂无结构化产品数据，请检查文件提取结果', 2000);
        return;
      }
      let scripts = getKbScripts();
      let updatedCount=0;
      scripts = scripts.map(s=>{
        let c=s.content; const orig=c; let changed=false;
        if(base.specs){
          const newPowerRange = base.specs.match(/\\d+(?:\\.\\d+)?\\s*kW\\s*[-–]\\s*\\d+(?:\\.\\d+)?\\s*kW/i);
          if(newPowerRange){ let b=c; c=c.replace(/\\d+(?:\\.\\d+)?\\s*kW\\s*[-–]\\s*\\d+(?:\\.\\d+)?\\s*kW/gi,newPowerRange[0]); if(c!==b) changed=true; }
          const eff=base.specs.match(/\\d+(?:\\.\\d+)?%\\s*(?:max\\s*)?efficiency/i);
          if(eff){ let b=c; c=c.replace(/\\d+(?:\\.\\d+)?%\\s*max efficiency/gi,eff[0]); if(c!==b) changed=true; }
          const cyc=base.specs.match(/\\d+,?\\d*\\+?\\s*cycles/i);
          if(cyc){ let b=c; c=c.replace(/\\d+,?\\d*\\+?\\s*cycles/gi,cyc[0]); if(c!==b) changed=true; }
          const ip=base.specs.match(/IP\\d+/i);
          if(ip){ let b=c; c=c.replace(/IP\\d+/gi,ip[0].toUpperCase()); if(c!==b) changed=true; }
        }
        if(base.models && base.models.trim()){
          const modelsStr=base.models.trim(); const first=modelsStr.split(',')[0].trim();
          let b=c; c=c.replace(/(产品型号|型号|Model|Models)\\s*[:：]\\s*[^\\n]+/gi,(m,p1)=>\`\${p1}: \${modelsStr}\`); if(first && /HAI-|HBP-/i.test(c)) c=c.replace(/\\b(?:HAI|HBP)[-_]?[A-Z0-9]+\\b/gi,first); if(c!==b) changed=true;
        }
        if(base.pricing.inv5k){ let b=c; c=c.replace(/(5kW[^\\$\\n]{0,50}\\$\\s*)\\d+/gi,\`$1\${base.pricing.inv5k}\`); c=c.replace(/\\$\\s*680\\b/g,\`$\${base.pricing.inv5k}\`); if(c!==b) changed=true; }
        if(base.pricing.inv10k){ let b=c; c=c.replace(/(10kW[^\\$\\n]{0,50}\\$\\s*)\\d+/gi,\`$1\${base.pricing.inv10k}\`); c=c.replace(/\\$\\s*1150\\b/g,\`$\${base.pricing.inv10k}\`); if(c!==b) changed=true; }
        if(base.pricing.bat5k){ let b=c; c=c.replace(/(5kWh[^\\$\\n]{0,50}\\$\\s*)\\d+/gi,\`$1\${base.pricing.bat5k}\`); c=c.replace(/\\$\\s*1250\\b/g,\`$\${base.pricing.bat5k}\`); if(c!==b) changed=true; }
        if(base.pricing.moq){ let b=c; c=c.replace(/MOQ\\s*:?\\s*\\d+\\s*sets?/gi,\`MOQ \${base.pricing.moq} sets\`); c=c.replace(/MOQ\\s*:?\\s*\\d+/gi,\`MOQ: \${base.pricing.moq}\`); if(c!==b) changed=true; }
        if(base.delivery.sample){ let b=c; c=c.replace(/Sample\\s*\\d+[-–]\\d+\\s*days/gi,\`Sample \${base.delivery.sample}\`); if(c!==b) changed=true; }
        if(base.delivery.bulk){ let b=c; c=c.replace(/Bulk\\s*\\d+[-–]\\d+\\s*days[^.\\n]*/gi,\`Bulk \${base.delivery.bulk}\`); if(c!==b) changed=true; }
        if(base.warranty.inverter){ let b=c; c=c.replace(/5-year warranty/gi,\`\${base.warranty.inverter} warranty\`); if(c!==b) changed=true; }
        if(base.warranty.battery){ let b=c; c=c.replace(/10 years \\/ 6000 cycles/gi,base.warranty.battery); if(c!==b) changed=true; }
        if(base.certs && /CE, IEC62109|Certifications?:/i.test(c)){ let b=c; c=c.replace(/CE, IEC62109[^.\\n]*/gi,base.certs); c=c.replace(/Certifications?:\\s*[^\\n]+/gi,\`Certifications: \${base.certs}\`); if(c!==b) changed=true; }
        if(c!==orig && changed){ updatedCount++; return {...s,content:c,updatedAt:new Date().toISOString()}; }
        return s;
      });
      saveKbScripts(scripts); if(typeof renderKB==='function') renderKB();
      if(updatedCount>0) showToast(\`同步完成，已更新 \${updatedCount} 条话术产品信息\`,2000);
      else showToast('未匹配到可更新的产品字段，话术保持不变',2000);
    }catch(e){ console.error(e); if(typeof renderKB==='function') renderKB(); showToast('已刷新',2000); }
  },50);
}

    case 'price': txt=\`FOB: 5kW $\${base.pricing.inv5k}, 10kW $\${base.pricing.inv10k}, Battery 5kWh $\${base.pricing.bat5k}, MOQ \${base.pricing.moq} sets\`; break;
    case 'models': txt=\`Models: \${base.models||'HAI-5K/10K, HBP-5K'}, Specs: \${base.specs||'Hybrid Inverter + LiFePO4'}\`; break;
    case 'delivery': txt=\`Lead time: Sample \${base.delivery.sample}, Bulk \${base.delivery.bulk}, Warehouse \${base.delivery.warehouse}, Sea \${base.delivery.sea}\`; break;
    case 'warranty': txt=\`Warranty: Inverter \${base.warranty.inverter}, Battery \${base.warranty.battery}\`; break;
    case 'certs': txt=\`Certifications: \${base.certs}\`; break;
    case 'tiered': txt=\`Tiered: \${base.pricing.tiered}\`; break;
    default: txt='';
  }
  const s=input.selectionStart;
  const e=input.selectionEnd;
  input.value=input.value.substring(0,s)+txt+input.value.substring(e);
  input.focus();
  input.setSelectionRange(s+txt.length, s+txt.length);
}

let kbCurrentCategory = 'all';
let kbCurrentSearch = '';
let kbCurrentType = '';
let kbExpandedId = null;

function loadKbScripts(){
  try{
    const stored = localStorage.getItem(LS_KEYS.kb);
    if(stored){
      const parsed = JSON.parse(stored);
      if(Array.isArray(parsed) && parsed.length>0) return parsed;
    }
  }catch(e){}
  return [...DEFAULT_KB_SCRIPTS];
}

function saveKbScripts(scripts){
  localStorage.setItem(LS_KEYS.kb, JSON.stringify(scripts));
}

function getKbScripts(){
  return loadKbScripts();
}

function renderKBOverview(allScripts){
  const scripts=Array.isArray(allScripts)?allScripts:[];
  const cats=new Set(scripts.map(x=>x.category).filter(Boolean));
  const types=new Set();
  scripts.forEach(x=>(x.customerTypes||[]).forEach(t=>types.add(t)));
  const a=document.getElementById('kbMetricScripts'); if(a) a.textContent=scripts.length;
  const b=document.getElementById('kbMetricCategories'); if(b) b.textContent=cats.size;
  const c=document.getElementById('kbMetricTypes'); if(c) c.textContent=Math.max(types.size,4);
  const d=document.getElementById('kbMetricUpdated'); if(d) d.textContent=scripts.length?'正常':'待添加';
}

function renderKB(){
  const navEl = document.getElementById('kbCategoryNav');
  const searchEl = document.getElementById('kbSearch');
  const typeEl = document.getElementById('kbTypeFilter');
  
  // 绑定搜索和筛选事件（仅一次）
  if(searchEl && !searchEl.dataset.bound){
    searchEl.addEventListener('input', (e)=>{ kbCurrentSearch = e.target.value.trim().toLowerCase(); renderKBContent(); });
    searchEl.dataset.bound='1';
  }
  if(typeEl && !typeEl.dataset.bound){
    typeEl.addEventListener('change', (e)=>{ kbCurrentType = e.target.value; renderKBContent(); });
    typeEl.dataset.bound='1';
  }
  
  // 渲染分类导航
  const allScripts = getKbScripts();
  renderKBOverview(allScripts);
  const counts = {};
  allScripts.forEach(s=>{ counts[s.category] = (counts[s.category]||0)+1; });
  
  let navHtml = \`<div class="kb-cat-item \${kbCurrentCategory==='all'?'active':''}" onclick="setKbCategory('all')" style="padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;\${kbCurrentCategory==='all'?'background:#EEF2FF;color:#165DFF;font-weight:600;border:1px solid #D0D5FF':'background:#fff;color:#4E5969;border:1px solid #E5E6EB'}"><span>📚 全部话术</span><span style="font-size:11px;background:\${kbCurrentCategory==='all'?'#D0D5FF':'#F2F3F5'};padding:2px 6px;border-radius:10px">\${allScripts.length}</span></div>\`;
  KB_CATEGORIES.forEach(cat=>{
    const isActive = kbCurrentCategory===cat.id;
    const cnt = counts[cat.id]||0;
    navHtml += \`<div class="kb-cat-item \${isActive?'active':''}" onclick="setKbCategory('\${cat.id}')" style="padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:2px;\${isActive?'background:#EEF2FF;color:#165DFF;font-weight:600;border:1px solid #D0D5FF':'background:#fff;color:#4E5969;border:1px solid #F0F0F0'}"><span>\${cat.icon} \${cat.name}</span><span style="font-size:11px;background:\${isActive?'#D0D5FF':'#F2F3F5'};padding:2px 6px;border-radius:10px">\${cnt}</span></div>\`;
  });
  if(navEl) navEl.innerHTML = navHtml;
  
  const totalEl = document.getElementById('kbTotalCount');
  if(totalEl) totalEl.textContent = \`\${allScripts.length}条\`;
  
  renderKBContent();
}

function setKbCategory(catId){
  kbCurrentCategory = catId;
  kbExpandedId = null;
  renderKB();
}

function renderKBContent(){
  const box = document.getElementById('kbContent');
  const emptyEl = document.getElementById('kbEmpty');
  if(!box) return;
  let scripts = getKbScripts();
  
  if(kbCurrentCategory!=='all'){
    scripts = scripts.filter(s=>s.category===kbCurrentCategory);
  }
  if(kbCurrentType){
    scripts = scripts.filter(s=>s.customerTypes.includes(kbCurrentType) || s.customerTypes.includes('全部'));
  }
  if(kbCurrentSearch){
    const kw = kbCurrentSearch.toLowerCase();
    scripts = scripts.filter(s=>{
      return (s.title && s.title.toLowerCase().includes(kw)) ||
             (s.content && s.content.toLowerCase().includes(kw)) ||
             (s.keywords && s.keywords.toLowerCase().includes(kw)) ||
             (s.scenario && s.scenario.toLowerCase().includes(kw));
    });
  }
  
  if(scripts.length===0){
    box.innerHTML='';
    if(emptyEl) emptyEl.innerHTML='<div class="empty"><b>未找到匹配话术</b>尝试调整关键词、分类或客户类型筛选<br>可点击右上角“+ 新增话术”添加</div>';
    return;
  }
  if(emptyEl) emptyEl.innerHTML='';
  
  box.innerHTML = scripts.map(s=>{
    const isExpanded = kbExpandedId===s.id;
    const catName = KB_CATEGORIES.find(c=>c.id===s.category)?.name||s.category||'通用';

function toggleKbCard(id){
  kbExpandedId = kbExpandedId===id ? null : id;
  renderKBContent();
}

function copyKbText(id){
  const s = getKbScripts().find(x=>x.id===id);
  if(!s) return;
  navigator.clipboard.writeText(s.content).then(()=>showToast('已复制到剪贴板')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=s.content; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('已复制');
  });
}

function insertKbToChat(id){
  const s = getKbScripts().find(x=>x.id===id);
  if(!s) return;
  // 切换到对话工作台并插入到输入框
  const input = document.getElementById('msgInput');
  if(input){
    input.value = s.content;
    input.focus();
    switchPage('chat');
    showToast('已插入到对话输入框');
  } else {
    // 如果不在对话页，先存到临时
    localStorage.setItem('haisic_temp_insert', s.content);
    switchPage('chat');
    setTimeout(()=>{
      const inp=document.getElementById('msgInput');
      if(inp){ inp.value=s.content; inp.focus(); }
    },300);
    showToast('已插入到对话输入框');
  }
}

// AI生成逻辑：根据需求描述自动生成商务英文话术
function generateAiKbScript(){
  const demandEl = document.getElementById('kbDemandInput');
  const types = [...document.querySelectorAll('#kbTypesCheck input:checked')].map(cb=>cb.value);
  const demand = demandEl ? demandEl.value.trim() : '';
  
  if(!demand){ alert('请输入话术需求'); if(demandEl) demandEl.focus(); return; }
  if(types.length===0){ alert('请选择至少一个客户类型'); return; }
  
  const genBtn = document.getElementById('kbAiGenerateBtn');
  const originalText = genBtn ? genBtn.textContent : '';
  if(genBtn){ genBtn.disabled=true; genBtn.textContent='⏳ AI生成中...'; genBtn.style.opacity='0.7'; }
  
  // 模拟AI生成延迟
  setTimeout(()=>{
    const result = aiGenerateScriptLogic(demand, types);
    
    // 填充到预览区
    document.getElementById('kbTitle').value = result.title;
    document.getElementById('kbCategorySel').value = result.category;
    document.getElementById('kbContentInput').value = result.content;
    document.getElementById('kbScenario').value = result.scenario;
    document.getElementById('kbTips').value = result.tips;
    document.getElementById('kbKeywords').value = result.keywords;
    
    const previewArea = document.getElementById('kbPreviewArea');
    const saveBtn = document.getElementById('kbSaveBtn');
    if(previewArea) previewArea.style.display='block';
    if(saveBtn) saveBtn.style.display='inline-flex';
    
    if(genBtn){ genBtn.disabled=false; genBtn.textContent='✨ 重新生成'; genBtn.style.opacity='1'; }
    
    showToast('AI话术已生成，可手动修改后保存');
    // 滚动到预览区
    if(previewArea) previewArea.scrollIntoView({behavior:'smooth', block:'start'});
  }, 800);
}

function aiGenerateScriptLogic(demand, customerTypes){

  const catKeywords = {
    'icebreaker': ['开场','首次','新客','欢迎','破冰','hello','hi','greeting','first','introduce','new customer','opening'],
    'needs': ['需求','挖掘','了解','预算','安装条件','周期','budget','needs','requirement','condition','confirm','discovery'],

// AI 联动：升级对话工作台右侧 AI 话术建议匹配逻辑，界面布局按钮不动
function getAiMatchedScripts(customer, recentMessages){
  const scripts=getKbScripts();
  const cType = customer.customerType || (customer.tags||[]).find(t=>['批发','分销商','安装商','终端零售'].includes(t)) || '终端零售';
  const status = customer.status||'';
  const intent = customer.intentLevel||'';
  
  // 关键词提取：最近3条客户消息
  const chatText = (recentMessages||[]).filter(m=>m.direction==='in').slice(-3).map(m=>m.content).join(' ').toLowerCase();
  const demandText = (customer.demand||'').toLowerCase() + ' ' + (customer.note||'').toLowerCase();
  const allText = chatText + ' ' + demandText;
  
  // 映射状态到分类
  const statusToCat = {
    '待初判':['icebreaker','needs'],
    '有效':['needs','product'],
    '跟进中':['followup','product','objection'],
    '待报价':['quotation','product'],
    '已报价':['followup','objection','quotation'],
    '高意向':['followup','quotation','closing'],
    '已成交':['closing','faq'],
    '无效':['faq']
  };
  
  let scored = scripts.map(s=>{
    let score=0;
    // 客户类型匹配 +3
    if(s.customerTypes.includes(cType)) score+=3;
    // 状态对应分类匹配 +5
    const cats = statusToCat[status]||[];
    if(cats.includes(s.category)) score+=5;
    // 高意向额外加分
    if(intent==='高' && ['quotation','followup','closing'].includes(s.category)) score+=2;
    // 关键词匹配
    if(allText){
      const kws = (s.keywords||'').toLowerCase().split(/[ ,，]+/);
      kws.forEach(k=>{
        if(k && allText.includes(k)) score+=2;
      });
      // 内容关键词简单匹配
      if(s.content.toLowerCase().includes('inverter') && allText.includes('inverter')) score+=1;
      if(s.content.toLowerCase().includes('battery') && allText.includes('battery')) score+=1;
      if(s.content.toLowerCase().includes('price') && (allText.includes('price')||allText.includes('报价')||allText.includes('cost'))) score+=2;
      if(s.content.toLowerCase().includes('warranty') && (allText.includes('warranty')||allText.includes('质保'))) score+=2;
    }
    return {script:s, score};
  });
  
  scored.sort((a,b)=>b.score-a.score);
  // 取前3条，分数>0
  return scored.filter(x=>x.score>0).slice(0,3).map(x=>x.script);
}


function renderFunnelBig(){
  const steps=[
    {label:'进线', count: customers.length, cls:'stage-blue'},
    {label:'有效', count: customers.filter(x=>['有效','高意向','已报价','已成交'].includes(x.status)).length, cls:'stage-purple'},
    {label:'意向', count: customers.filter(x=>['高意向','已报价','已成交'].includes(x.status)).length, cls:'stage-orange'},
    {label:'报价', count: customers.filter(x=>['已报价','已成交'].includes(x.status)).length, cls:'stage-orange'},
    {label:'成交', count: customers.filter(x=>x.status==='已成交').length, cls:'stage-green'},
  ];
  const total=steps[0].count||0;
  const pct=n=>total?Math.round(n/total*100):0;
  const valid=steps[1].count, intent=steps[2].count, quote=steps[3].count, deal=steps[4].count;
  const validRate=pct(valid), intentRate=pct(intent), quoteRate=pct(quote), dealRate=pct(deal);
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set('funnelMetricInbound',total); set('funnelMetricValid',valid); set('funnelMetricQuote',quote); set('funnelMetricIntent',intent); set('funnelMetricDeal',deal);
  set('funnelMetricValidRate',validRate+'% 转化'); set('funnelMetricIntentRate',intentRate+'% 转化'); set('funnelMetricQuoteRate',quoteRate+'% 转化'); set('funnelMetricDealRate',dealRate+'% 成交率'); set('funnelMetricDealRate2',dealRate+'%');
  set('funnelInsightValid',validRate+'%'); set('funnelInsightQuote',total?Math.round(quote/(valid||1)*100)+'%':'0%'); set('funnelInsightDeal',dealRate+'%');

  const c=document.getElementById('funnelBig');
  if(c){
    const visual=c.parentElement;
    if(visual){
      const colors=['#315EF6','#5B6DE8','#8064D7','#D97706','#16865C'];
      if(!total){
        visual.innerHTML='<div class="funnel-empty-state"><div class="funnel-empty-orb"><span>↗</span></div><b>暂无转化数据</b><p>同步真实客户后，将自动生成阶段转化和流失分析</p><button class="funnel-demo-btn" type="button" onclick="enableHaisicDemoPreview()">查看数据模板</button><small>仅当前页面临时预览，不会写入正式数据</small></div>';
      }else{
        visual.innerHTML='<div class="funnel-line-chart">'+steps.map((item,i)=>{const prev=i?steps[i-1].count:total;const rate=i===0?100:(prev?Math.round(item.count/prev*100):0);return '<div class="funnel-line-step"><div class="funnel-line-top"><span class="funnel-line-dot" style="background:'+colors[i]+'"></span><span class="funnel-line-name">'+item.label+'</span><b>'+item.count+'<small>人</small></b></div><div class="funnel-line-track"><span style="width:'+Math.max(pct(item.count),3)+'%;background:'+colors[i]+'"></span></div><div class="funnel-line-meta"><span>占总进线 '+pct(item.count)+'%</span><span>阶段转化 '+rate+'%</span></div></div>'+ (i<steps.length-1?'<div class="funnel-line-connector"></div>':'');}).join('')+'</div>';
      }
    }
    const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
    const max=total||1;
    if(!total){
      const W=c.width,H=c.height; ctx.textAlign='center';
      ctx.fillStyle='#EEF3FF';ctx.beginPath();ctx.arc(W/2,H/2-22,27,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#172033';ctx.font='700 14px -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif';ctx.fillText('暂无转化数据',W/2,H/2+22);
      ctx.fillStyle='#98A2B3';ctx.font='11px -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif';ctx.fillText('同步真实客户后，将自动生成阶段转化和流失分析',W/2,H/2+43);
    } else {
    const colors=['#4E73DF','#7567D9','#C96EB4','#E99459','#4FAF7D'];
    const light=['#EEF3FF','#F1EEFF','#F9EEF7','#FFF4EA','#EDF9F2'];
    const left=62, trackW=496, rowH=34, gap=9, top=16;
    steps.forEach((item,i)=>{
      const y=top+i*(rowH+gap);
      const fillW=Math.max(item.count?10:0, Math.round(trackW*(item.count/max)));
      // 背景轨道
      ctx.fillStyle=light[i];
      ctx.beginPath(); ctx.roundRect(left,y,trackW,rowH,8); ctx.fill();
      // 彩色进度
      if(fillW>0){
        ctx.fillStyle=colors[i];
        ctx.beginPath(); ctx.roundRect(left,y,fillW,rowH,8); ctx.fill();
      }
      // 阶段名称
      ctx.textAlign='left';
      ctx.font='700 11px -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif';
      ctx.fillStyle=fillW>90?'#FFFFFF':'#344054';
      ctx.fillText(item.label,left+11,y+21);
      // 数值与比例始终在右侧，信息更容易扫读
      ctx.textAlign='right';
      ctx.font='700 11px -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif';
      ctx.fillStyle=fillW>170?'#FFFFFF':colors[i];
      ctx.fillText(item.count+'  ·  '+pct(item.count)+'%',left+trackW-11,y+21);
    }); }
  }
  const stat=document.getElementById('funnelStats');
  if(stat){
    stat.innerHTML=steps.map((item,i)=>{const prev=i?steps[i-1].count:total;const stageRate=i===0?100:(prev?Math.round(item.count/prev*100):0);const lost=i===0?0:Math.max(0,prev-item.count);return \`<div class="funnel-stage-row">
      <span class="stage-index \${item.cls}">\${i+1}</span>
      <div><div class="stage-name">\${item.label}</div><div class="stage-meta">\${i===0?'转化起点':('阶段转化 '+stageRate+'%'+(lost?' · 流失 '+lost:' · 无流失'))}</div></div>
      <div class="stage-value"><b>\${item.count}<small> 人</small></b><span>占总进线 \${pct(item.count)}%</span></div>
    </div>\`}).join('');
  }
}

// 话术3天自动迭代优化功能 - 核心：每72小时自动触发
const LS_KEYS_AUTO_OPT = {
  lastOptTime: 'haisic_kb_auto_opt_last_time',
  manualEditedIds: 'haisic_kb_manual_edited_ids',
  lastSyncReset: 'haisic_kb_last_sync_reset'
};

function getManualEditedIds(){
  try{
    const raw = localStorage.getItem(LS_KEYS_AUTO_OPT.manualEditedIds);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}

function markKbAsManuallyEdited(id){
  try{
    if(!id) return;
    let ids = getManualEditedIds();
    if(!ids.includes(id)){
      ids.push(id);
      localStorage.setItem(LS_KEYS_AUTO_OPT.manualEditedIds, JSON.stringify(ids));
      console.log('[自动优化] 标记手动编辑:', id);
    }
  }catch(e){}
}

function isManuallyEdited(id){
  return getManualEditedIds().includes(id);
}

function getRecentCustomerData(days=3){
  const cutoff = Date.now() - days*24*60*60*1000;
  let customers = [];
  let messages = [];
  try{
    customers = JSON.parse(localStorage.getItem('haisic_customers')||'[]');
    messages = JSON.parse(localStorage.getItem('haisic_messages')||'[]');
  }catch(e){}
  
  const recentCustomers = customers.filter(c=>{
    const t = new Date(c.lastMessageAt||c.createdAt||0).getTime();
    return t >= cutoff;
  });
  const recentMessages = messages.filter(m=>{
    const t = new Date(m.timestamp||m.createdAt||0).getTime();
    return t >= cutoff;
  });

  const queries = [];
  recentMessages.forEach(m=>{
    if(m.content) queries.push(m.content);
  });
  recentCustomers.forEach(c=>{
    if(c.lastMessage) queries.push(c.lastMessage);
    if(c.inquiry) queries.push(c.inquiry);
  });

  return { recentCustomers, recentMessages, queries };
}

function analyzeCustomerData(queries){
  const analysis = {
    highFreqQuestions: [],
    coreConcerns: [],
    commonObjections: [],
    expressionStyle: 'professional',
    topNeeds: []
  };

  if(queries.length===0) return analysis;

  const text = queries.join(' ').toLowerCase();
  
  const questionKeywords = {
    'price': ['price','报价','多少钱','单价','cost'],
    'delivery': ['delivery','交期','交货','lead time','shipping'],
    'warranty': ['warranty','质保','保修','guarantee'],
    'moq': ['moq','起订量','minimum order'],
    'certification': ['certification','认证','ce','certificate'],
    'efficiency': ['efficiency','效率','转换效率'],
    'installation': ['installation','安装','install'],
    'battery': ['battery','电池','kwh'],
    'inverter': ['inverter','逆变器']
  };

  const freqMap = {};
  Object.keys(questionKeywords).forEach(key=>{
    let count=0;
    questionKeywords[key].forEach(kw=>{
      const matches = (text.match(new RegExp(kw.toLowerCase(), 'gi'))||[]).length;
      count+=matches;
    });
    if(count>0) freqMap[key]=count;
  });

  const sortedFreq = Object.entries(freqMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  analysis.highFreqQuestions = sortedFreq.map(([k])=>k);
  analysis.topNeeds = sortedFreq.slice(0,3).map(([k])=>k);

  if(freqMap['price']) analysis.coreConcerns.push('价格敏感，关注性价比');
  if(freqMap['delivery']) analysis.coreConcerns.push('交期关注，急需快速交付');
  if(freqMap['warranty']) analysis.coreConcerns.push('质保关注，重视售后保障');
  if(freqMap['certification']) analysis.coreConcerns.push('认证关注，需符合当地标准');

  if(text.includes('expensive')||text.includes('贵')) analysis.commonObjections.push('价格异议');
  if(text.includes('long')&&text.includes('delivery')||text.includes('交期长')) analysis.commonObjections.push('交期异议');

  if(text.includes('please')||text.includes('could you')) analysis.expressionStyle = 'polite';
  else if(text.includes('urgent')||text.includes('asap')||text.includes('急')) analysis.expressionStyle = 'urgent';

  return analysis;
}

function optimizeKbContentWithAI(originalContent, productData, analysis, targetLang){
  let content = originalContent;
  const brandEn = productData.brandEn || productData.brand || 'HaiSic';
  const brandZh = productData.brandZh || productData.brand || '海思';
  const seo = getRandomRegionScene(targetLang);

  // 自动优化优先调整提问方式与表达逻辑，不修改基准库核心数据
  // 优先从聊天记录提取高频问题与痛点

  // 开场探询→需求挖掘→对应解答逻辑
  if(content.match(/您好|我们是|Hello|Thanks for reaching out/i) || content.match(/主营|main models|看到您在关注/)){
    // 去硬广化，地域/场景切入+轻自我介绍+开放式提问
    if(analysis.topNeeds.length>0){
      const topNeed = analysis.topNeeds[0];
      if(targetLang==='zh'){
        // 融入地域词+场景/痛点词
        if(!content.includes(seo.region)){
          content = content.replace(/您在关注/, \`看到您在关注\${seo.region}的\${seo.scene}项目，想了解下\`);
        }
        if(topNeed==='price' && content.match(/主营|性价比/)){
          // 按客户关注度排序，提问与互动占比不低于50%
          if(!content.includes('您更看重')){
            content += \`，您这边更看重前期投入还是长期收益呢？\`;
          }
        }
      } else {
        if(!content.includes(seo.region)){
          content = content.replace(/exploring/, \`exploring \${seo.scene} projects in \${seo.region},\`);
        }
        if(topNeed==='price' && !content.toLowerCase().includes('do you value')){
          content += \` Do you value upfront cost or long-term return more?\`;
        }
      }
    }
    
    // 确保提问与互动占比不低于50% - 增加开放式提问
    const questionCount = (content.match(/吗？|呢？|\\?/g)||[]).length;
    if(questionCount===0){
      if(targetLang==='zh'){
        content += \` 方便聊聊您的具体场景吗？\`;
      } else {
        content += \` Could you share your specific scenario?\`;
      }
    }
  }

  // 需求挖掘类 - 分层提问逻辑
  if(content.match(/生意规模|项目场景|核心痛点|交付要求|business scale|project scenario/i)){
    if(analysis.highFreqQuestions.length>0){
      const freqQ = analysis.highFreqQuestions[0];
      if(targetLang==='zh' && !content.includes('您在')){
        content = content.replace(/方便问下/, \`看到您咨询\${freqQ}比较多，方便问下\`);
      }
    }
  }

  // 产品介绍类 - 问题对应式，删除纯参数罗列
  if(content.match(/针对您提到的|可以很好解决|For the.*you mentioned/i)){
    // 确保产品参数占比不超过30% - 已通过模板控制为解决的问题+参数佐证
    // 按客户关注度排序，优先展示高频咨询的核心优势
    if(analysis.highFreqQuestions.includes('efficiency') && productData.efficiency){
      if(targetLang==='zh' && !content.includes('有效降低')){
        content = content.replace(new RegExp(productData.efficiency.replace(/[.*+?^\${}()|[\\]\\\\]/g, '\\\\$&')), \`\${productData.efficiency}能有效降低\${seo.corePain}\`);
      }
    }
  }

  // 报价交期类 - 保留数据呈现，前置需求确认铺垫
  if(content.match(/了解您需要|报价|Quotation|Got it.*need/i)){
    if(analysis.coreConcerns.length>0){
      const concern = analysis.coreConcerns[0];
      if(targetLang==='zh' && !content.includes('主要考虑')){
        content = content.replace(/了解您需要/, \`了解您需要\${analysis.topNeeds[0]||''}，主要考虑\${concern.includes('价格')?'性价比':'交付'}对吧？了解到您需要\`);
      }
    }
  }

  // 自动校验：单条话术产品参数占比不超过30%，提问与互动占比不低于50%
  const paramMatches = content.match(/\\$\\d+|\\d+kW|\\d+kWh|\\d+%|IP\\d+|\\d+ cycles/gi)||[];
  const paramRatio = paramMatches.length*8 / content.length;
  if(paramRatio > 0.3){
    // 不删除参数，但确保提问占比 - 已通过模板设计保证
    if((content.match(/\\?|吗|呢/g)||[]).length < 1){
      if(targetLang==='zh') content += ' 您看这样是否符合您的预期呢？';
      else content += ' Does this meet your expectation?';
    }
  }

  // 品牌名、核心参数基准库保留
  if(!content.includes(brandEn) && !content.includes(brandZh)){
    if(targetLang==='zh'){
      content = content.replace(/我们是[^，,。\\n]{2,20}/, \`我们是 \${brandZh}\`);
    } else {
      content = content.replace(/we are\\s+[^,\\n!.]{2,20}/i, \`we are \${brandEn}\`);
    }
  }

  return content;
}


function autoOptimizeKbScripts(){
  console.log('[自动优化] 开始3天自动迭代优化');
  const { queries } = getRecentCustomerData(3);
  
  if(queries.length===0){
    console.log('[自动优化] 近3天无客户咨询，跳过优化');
    localStorage.setItem(LS_KEYS_AUTO_OPT.lastOptTime, Date.now().toString());
    return;
  }

  const analysis = analyzeCustomerData(queries);
  console.log('[自动优化] 分析结果:', analysis);

  let scripts = getKbScripts();
  let optimizedCount = 0;

  scripts = scripts.map(s=>{
    if(isManuallyEdited(s.id)){
      console.log('[自动优化] 跳过手动编辑话术:', s.id);
      return s;
    }

    const original = s.content;
    const targetLang = s.language || detectLanguage(original);
    
    let productData = null;
    try{
      const unified = loadUnifiedBase();
      if(unified.length>0) productData = unified[0].productData || unified[0].baseData;
      else productData = loadProductBase();
    }catch(e){
      productData = loadProductBase();
    }
    if(!productData) productData = JSON.parse(JSON.stringify(DEFAULT_PRODUCT_BASE));

    const optimized = optimizeKbContentWithAI(original, productData, analysis, targetLang);
    
    if(optimized !== original){
      optimizedCount++;
      return {...s, content:optimized, updatedAt:new Date().toISOString()};
    }
    return s;
  });

  if(optimizedCount>0){
    saveKbScripts(scripts);
    if(typeof renderKB==='function') renderKB();
    showAutoOptimizeToast();
    localStorage.setItem(LS_KEYS_AUTO_OPT.lastOptTime, Date.now().toString());
    console.log('[自动优化] 完成，优化', optimizedCount, '条话术');
  } else {
    console.log('[自动优化] 无需优化');
    localStorage.setItem(LS_KEYS_AUTO_OPT.lastOptTime, Date.now().toString());
  }
}

  }, 2000);
}

function initAutoOptimizeTimer(){
  const lastTime = parseInt(localStorage.getItem(LS_KEYS_AUTO_OPT.lastOptTime)||'0');
  const lastSyncReset = parseInt(localStorage.getItem(LS_KEYS_AUTO_OPT.lastSyncReset)||'0');
  const last = Math.max(lastTime, lastSyncReset);
  const now = Date.now();
  const cycle = 72*60*60*1000;

  if(last===0){
    localStorage.setItem(LS_KEYS_AUTO_OPT.lastOptTime, now.toString());
    console.log('[自动优化] 初始化定时器，下次优化:', new Date(now+cycle).toLocaleString());
  } else {
    const elapsed = now - last;
    if(elapsed >= cycle){
      console.log('[自动优化] 已到3天周期，立即执行优化');
      setTimeout(()=>autoOptimizeKbScripts(), 3000);
    } else {
      const remaining = cycle - elapsed;
      console.log('[自动优化] 距离下次优化还有', Math.round(remaining/1000/60/60), '小时');
    }
  }

  setInterval(()=>{
    const lastCheck = parseInt(localStorage.getItem(LS_KEYS_AUTO_OPT.lastOptTime)||'0');
    const lastSync = parseInt(localStorage.getItem(LS_KEYS_AUTO_OPT.lastSyncReset)||'0');
    const lastT = Math.max(lastCheck, lastSync);
    if(Date.now() - lastT >= cycle){
      autoOptimizeKbScripts();
    }
  }, 60*60*1000);
}

function resetAutoOptimizeTimer(){
  localStorage.setItem(LS_KEYS_AUTO_OPT.lastSyncReset, Date.now().toString());
  localStorage.setItem(LS_KEYS_AUTO_OPT.lastOptTime, Date.now().toString());
  console.log('[自动优化] 手动同步后重置72小时周期');
}

document.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(initAutoOptimizeTimer, 2000);
});

<div id="funnel_custom_mask" class="funnel_custom_mask">
  <div class="funnel_custom_modal" onclick="event.stopPropagation()">
    <div style="font-size:14px;font-weight:700;margin-bottom:16px">自定义日期</div>
    <div style="margin-bottom:14px"><div style="font-size:12px;color:#4E5969">开始日期</div><input type="date" id="funnel_start_date" class="funnel_date_input" onchange="funnel_validateCustom()" /><div id="funnel_start_err" style="font-size:10px;color:#F53F3F;margin-top:4px;display:none"></div></div>
    <div style="margin-bottom:20px"><div style="font-size:12px;color:#4E5969">结束日期</div><input type="date" id="funnel_end_date" class="funnel_date_input" onchange="funnel_validateCustom()" /><div id="funnel_end_err" style="font-size:10px;color:#F53F3F;margin-top:4px;display:none"></div></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="funnel_btn_cancel" onclick="funnel_closeCustom(event)">取消</button><button class="funnel_btn_primary" id="funnel_apply_btn" onclick="funnel_applyCustom(event)" disabled>应用</button></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  console.log('[funnel] 初始化 - 在漏斗分析列表，不是话术库');

  const funnel_defs = [
    { id:'inquiry', name:'进线', color:'#165DFF', bg:'linear-gradient(90deg,#E8F0FF 0%,#D9E6FF 100%)', text:'#165DFF', baseline:100 },
    { id:'valid', name:'有效', color:'#165DFF', bg:'linear-gradient(90deg,#EEF2FF 0%,#E0E8FF 100%)', text:'#165DFF', baseline:15 },
    { id:'intent', name:'意向', color:'#722ED1', bg:'linear-gradient(90deg,#F5E8FF 0%,#EBD6FF 100%)', text:'#722ED1', baseline:60 },
    { id:'quote', name:'报价', color:'#FA8C16', bg:'linear-gradient(90deg,#FFF7E6 0%,#FFE7BA 100%)', text:'#FA8C16', baseline:70 },
    { id:'deal', name:'成交', color:'#00B42A', bg:'linear-gradient(90deg,#E8FFEA 0%,#C6F7C9 100%)', text:'#00B42A', baseline:30 }
  ];

  let funnel_data = { stages:{ inquiry:20, valid:2, intent:2, quote:2, deal:1, lost:15 }, total:20, rates:{ valid:10, intent:100, quote:100, deal:50, lost:75 }, by_source:{'FB广告':12,'TikTok私信':5,'官网表单':3}, by_type:{'安装商':10,'分销商':6,'终端':4}, by_region:{'澳洲':8,'德国':7,'美国':5}, filtered:[] };
  let funnel_filters = { time:'today', source:'all', type:'all', region:'all', custom_start:null, custom_end:null };
  let funnel_custom_range = { start:null, end:null };
  let funnel_earliest = null;

  function funnel_getEarliest(){
    try{
      let cs=JSON.parse(localStorage.getItem('haisic_customers')||'[]');
      if(cs.length===0) return new Date(Date.now()-90*86400000);
      let min=Infinity;
      cs.forEach(c=>{ const t=new Date(c.lastMessageAt||c.createdAt||c.updatedAt||0).getTime(); if(t>0 && t<min) min=t; });
      return min===Infinity ? new Date(Date.now()-90*86400000) : new Date(min);
    }catch(e){ return new Date(Date.now()-90*86400000); }
  }

  function funnel_getRange(type){
    const now=new Date();
    const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0);
    if(type==='today') return { start:todayStart, end:now };
    if(type==='7d'){ const s=new Date(now.getFullYear(),now.getMonth(),now.getDate()-6,0,0,0); return { start:s, end:now }; }
    if(type==='30d'){ const s=new Date(now.getFullYear(),now.getMonth(),now.getDate()-29,0,0,0); return { start:s, end:now }; }
    if(type==='custom' && funnel_custom_range.start) return { start:funnel_custom_range.start, end:funnel_custom_range.end };
    return { start:todayStart, end:now };
  }

  function funnel_load(){
    try{
      let customers=JSON.parse(localStorage.getItem('haisic_customers')||'[]');
      if(customers.length===0) return funnel_data;
      let range;
      if(funnel_filters.time==='custom' && funnel_filters.custom_start) range={ start:funnel_filters.custom_start, end:funnel_filters.custom_end };
      else range=funnel_getRange(funnel_filters.time);
      let filtered=customers.filter(c=>{
        const t=new Date(c.lastMessageAt||c.createdAt||c.updatedAt||0).getTime();
        if(range.start && t < range.start.getTime()) return false;
        if(range.end && t > range.end.getTime()) return false;
        if(funnel_filters.source!=='all' && (c.source||'unknown')!==funnel_filters.source) return false;
        if(funnel_filters.type!=='all' && (c.customerType||c.type||'unknown')!==funnel_filters.type) return false;
        if(funnel_filters.region!=='all' && (c.region||'unknown')!==funnel_filters.region) return false;
        return true;
      });
      let stages={ inquiry:0, valid:0, intent:0, quote:0, deal:0, lost:0 };
      let by_source={}, by_type={}, by_region={};
      filtered.forEach(c=>{
        const st=c.funnelStage||c.stage||'inquiry';
        if(stages[st]!==undefined) stages[st]++; else stages.inquiry++;
        const src=c.source||'unknown'; by_source[src]=(by_source[src]||0)+1;
        const tp=c.customerType||c.type||'unknown'; by_type[tp]=(by_type[tp]||0)+1;
        const rg=c.region||'unknown'; by_region[rg]=(by_region[rg]||0)+1;
      });
      const total=filtered.length||0;
      const rates={ valid: total>0?(stages.valid/total*100):0, intent: stages.valid>0?(stages.intent/stages.valid*100):0, quote: stages.intent>0?(stages.quote/stages.intent*100):0, deal: stages.quote>0?(stages.deal/stages.quote*100):0, lost: total>0?(stages.lost/total*100):0 };
      if(total>0){ const calcLost=total - stages.deal; if(stages.lost < calcLost) stages.lost=calcLost; rates.lost=(stages.lost/total*100); }
      if(total===0) return funnel_data;
      return { stages, total, rates, by_source, by_type, by_region, filtered };
    }catch(e){ console.error('[funnel] load error',e); return funnel_data; }
  }

  function funnel_showLoading(){
    const el=document.getElementById('funnelAnalysisModule');
    if(!el) return;
    let loading=document.getElementById('funnel_loading');
    if(!loading){
      loading=document.createElement('div');
      loading.id='funnel_loading';
      loading.className='funnel_loading';
      loading.innerHTML='<div class="funnel_spinner"></div><span style="margin-left:8px;font-size:12px">加载中...</span>';
      el.style.position='relative';
      el.appendChild(loading);
    }
    loading.style.display='flex';
  }
  function funnel_hideLoading(){
    const l=document.getElementById('funnel_loading');
    if(l) l.style.display='none';
  }

  window.funnel_render=function(){
    // ===== 路由兜底校验 - 双重保险避免串页 =====
    try {
      const currentPath = window.location.pathname;
      const isFileProto = window.location.protocol === 'file:';
      if (!isFileProto) {
        if (currentPath !== '/funnel-analysis') {
          const funnelPageEl = document.getElementById('page-funnel');
          const isActiveByClass = funnelPageEl && funnelPageEl.classList.contains('active');
          const isActiveByVar = (typeof activePage !== 'undefined' && activePage === 'funnel');
          if (!isActiveByClass && !isActiveByVar) {
            const el = document.getElementById('funnelAnalysisModule');
            if (el) el.innerHTML = '';
            return null;
          }
        }
      } else {
        if (typeof activePage !== 'undefined' && activePage !== 'funnel') {
          const el = document.getElementById('funnelAnalysisModule');
          const funnelPageActive = document.getElementById('page-funnel')?.classList.contains('active');
          if (!funnelPageActive) {
            if (el) el.innerHTML = '';
            return null;
          }
        }
      }
    } catch(e){}

    const funnelEl=document.getElementById('funnelAnalysisModule');
    if(!funnelEl){ console.warn('[funnel] 容器不存在'); return; }
    // 确保在 page-funnel 内，不在话术库
    const pageFunnel=document.getElementById('page-funnel');
    const kbEl=document.getElementById('kbContent');
    if(kbEl && (funnelEl.contains(kbEl) || kbEl.contains(funnelEl))){
      console.error('[funnel] 隔离失败 - 与话术库嵌套');
      return;
    }
    if(pageFunnel && !pageFunnel.contains(funnelEl)){
      pageFunnel.innerHTML='';
      pageFunnel.appendChild(funnelEl);
    }

    const data=funnel_load();
    const { stages, total, rates, by_source, by_type, by_region }=data;
    const customTip = funnel_custom_range.start ? \`\${funnel_custom_range.start.toLocaleDateString()} - \${funnel_custom_range.end.toLocaleDateString()}\` : '';

    let html=\`<div class="funnel_top_bar"><div class="funnel_title">漏斗分析·全链路转化</div><div class="funnel_time_tabs">
      <button class="funnel_time_btn \${funnel_filters.time==='today'?'active':''}" onclick="funnel_setTime(event,'today')">今天</button>
      <button class="funnel_time_btn \${funnel_filters.time==='7d'?'active':''}" onclick="funnel_setTime(event,'7d')">近7天</button>
      <button class="funnel_time_btn \${funnel_filters.time==='30d'?'active':''}" onclick="funnel_setTime(event,'30d')">近30天</button>
      <button class="funnel_time_btn \${funnel_filters.time==='custom'?'active':''}" onclick="funnel_setTime(event,'custom')">\${customTip ? '自定义' : '自定义'}\${customTip?\`<span class="funnel_tooltip">\${customTip}</span>\`:''}</button>
    </div></div>\`;

    if(total===0){
      html+=\`<div class="funnel_ai_box empty">暂无足够数据生成诊断 - 显示演示数据<br><br><button onclick="funnel_useDemo(event)" style="padding:6px 12px;border-radius:6px;border:1px solid #165DFF;color:#165DFF;background:#fff;cursor:pointer">查看演示数据</button></div>\`;
      funnelEl.innerHTML=html;
      return;
    }

    html+=\`<div class="funnel_main"><div class="funnel_left"><div class="funnel_triangle">\`;
    const maxCount=Math.max(stages.inquiry||total,1);
    let prevCount=maxCount;
    funnel_defs.forEach((stage, idx)=>{
      const count=stages[stage.id]||0;
      const widthPercent=Math.max(22,(count/maxCount*100));
      const rateToInquiry=total>0?(count/total*100).toFixed(0):0;
      const loss=idx===0?0:(prevCount-count);
      prevCount=count;
      let isLowest=false; { let min=100,minId=null; Object.keys(rates).forEach(k=>{ if(k!=='lost' && rates[k]>0 && rates[k]<min){ min=rates[k]; minId=k; } }); isLowest=minId===stage.id; }
      html+=\`<div class="funnel_layer" style="width:\${widthPercent}%" onclick="funnel_drill(event,'\${stage.id}')"><div class="funnel_layer_inner" style="background:\${stage.bg};color:\${stage.text};border-color:\${stage.color}20;\${isLowest?'box-shadow:0 0 0 2px #F53F3F':''}"><span>\${stage.name} \${count}人 \${rateToInquiry}%</span><span class="funnel_loss_badge" style="display:\${loss>0?'block':'none'}">-\${loss}</span></div></div>\`;
      if(idx<funnel_defs.length-1){
        const next=funnel_defs[idx+1]; const nextRate=rates[next.id]||0; const isBelow=nextRate>0 && nextRate < next.baseline;
        html+=\`<div class="funnel_arrow"><span>↓</span><span class="funnel_arrow_rate \${isBelow?'low':''}">\${stage.name}→\${next.name} \${nextRate.toFixed(0)}%转化率</span></div>\`;
      }
    });
    html+=\`</div></div><div class="funnel_right"><div class="funnel_table"><div class="funnel_table_header"><span>阶段</span><span>客户数</span><span>占进线占比</span><span>阶段转化率</span></div>\`;
    funnel_defs.forEach((stage, idx)=>{
      const count=stages[stage.id]||0; const rateToInquiry=total>0?(count/total*100).toFixed(0):0; const stageRate=idx===0?100:rates[stage.id]||0; const isBelow=idx>0 && stageRate>0 && stageRate < stage.baseline;
      html+=\`<div class="funnel_table_row"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:\${stage.color};margin-right:4px"></span>\${stage.name}</span><span>\${count}</span><span>\${rateToInquiry}%</span><span class="\${isBelow?'funnel_red':''}">\${stageRate.toFixed(0)}% \${isBelow?'⚠️':''}</span></div>\`;
    });
    html+=\`<div class="funnel_table_row lost"><span style="color:#F53F3F">流失</span><span style="color:#F53F3F">\${stages.lost||0}</span><span style="color:#F53F3F">\${rates.lost.toFixed(0)}%</span><span style="color:#F53F3F">-</span></div></div></div></div>\`;

    html+=\`<div class="funnel_filter_bar"><span style="font-size:12px;font-weight:600">多维度筛选：</span>
      <div style="position:relative"><button class="funnel_filter_btn \${funnel_filters.source!=='all'?'has':''}" onclick="funnel_toggle(event,'source')">按来源渠道 \${funnel_filters.source!=='all'?'·'+funnel_filters.source:''} ▼</button><div class="funnel_dropdown" id="funnel_dd_source"><div class="funnel_item" onclick="funnel_set(event,'source','all')">全部来源</div>\${Object.keys(by_source).map(s=>\`<div class="funnel_item" onclick="funnel_set(event,'source','\${s}')"><span>\${s}</span><span>\${by_source[s]}人</span></div>\`).join('')}</div></div>
      <div style="position:relative"><button class="funnel_filter_btn \${funnel_filters.type!=='all'?'has':''}" onclick="funnel_toggle(event,'type')">按客户类型 \${funnel_filters.type!=='all'?'·'+funnel_filters.type:''} ▼</button><div class="funnel_dropdown" id="funnel_dd_type"><div class="funnel_item" onclick="funnel_set(event,'type','all')">全部类型</div>\${Object.keys(by_type).map(s=>\`<div class="funnel_item" onclick="funnel_set(event,'type','\${s}')"><span>\${s}</span><span>\${by_type[s]}人</span></div>\`).join('')}</div></div>
      <div style="position:relative"><button class="funnel_filter_btn \${funnel_filters.region!=='all'?'has':''}" onclick="funnel_toggle(event,'region')">按地区 \${funnel_filters.region!=='all'?'·'+funnel_filters.region:''} ▼</button><div class="funnel_dropdown" id="funnel_dd_region"><div class="funnel_item" onclick="funnel_set(event,'region','all')">全部地区</div>\${Object.keys(by_region).map(s=>\`<div class="funnel_item" onclick="funnel_set(event,'region','\${s}')"><span>\${s}</span><span>\${by_region[s]}人</span></div>\`).join('')}</div></div>
      <button onclick="funnel_clear(event)" style="font-size:11px;color:#165DFF;background:none;border:none;cursor:pointer">清空筛选</button></div>\`;

    let lowest=null,lowRate=100; Object.keys(rates).forEach(k=>{ if(k!=='lost' && rates[k]>0 && rates[k]<lowRate){ lowRate=rates[k]; lowest=k; } });
    if(!lowest || total<3){ html+=\`<div class="funnel_ai_box empty">暂无足够数据生成诊断</div>\`; }
    else{
      const info=funnel_defs.find(s=>s.id===lowest);
      const map={
        valid:{ problem:\`进线→有效转化率仅\${rates.valid.toFixed(0)}%，低于\${info.baseline}%基准线，是全漏斗最大流失点\`, suggestion:'优化首触开场话术，增加身份确认，过滤无效咨询' },
        intent:{ problem:\`有效→意向转化率仅\${rates.intent.toFixed(0)}%，低于\${info.baseline}%基准线，需求挖掘不足\`, suggestion:'分层提问挖掘，批发问采购量和合作品牌，安装商问项目功率和并网要求' },
        quote:{ problem:\`意向→报价转化率仅\${rates.quote.toFixed(0)}%，低于\${info.baseline}%基准线，一问就报价\`, suggestion:'设置报价门槛，必须问清采购数量、交货地点、是否含配件/售后，再结合价值报价' },
        deal:{ problem:\`报价→成交转化率仅\${rates.deal.toFixed(0)}%，低于\${info.baseline}%基准线，异议处理不足\`, suggestion:'前置价格/认证/交期/质保异议预案，准备佐证资料，明确成交引导' }
      };
      const item=map[lowest]||{ problem:\`\${info.name}转化率仅\${lowRate.toFixed(0)}%\`, suggestion:'检查话术与跟进流程' };
      html+=\`<div class="funnel_ai_box has"><div style="font-size:12px;font-weight:700;margin-bottom:8px">AI诊断</div><div style="background:#fff;border-radius:8px;padding:12px;border-left:3px solid #F53F3F"><div style="font-size:11px;color:#F53F3F;font-weight:600">核心问题：\${item.problem}</div><div style="font-size:11px;color:#4E5969;margin-top:6px;line-height:1.6">优化建议：\${item.suggestion}</div></div><div style="margin-top:12px"><button onclick="funnel_goto(event)" style="font-size:11px;padding:6px 14px;border-radius:20px;background:#165DFF;color:#fff;border:none;cursor:pointer">去优化开场话术</button></div></div>\`;
    }

    funnelEl.innerHTML=html;
    console.log('[funnel] 渲染完成 - 单一模块，无重复，数据口径统一', total, stages);
  };

  window.funnel_setTime=function(e,type){
    try {
      if (window.location.protocol !== 'file:' && window.location.pathname !== '/funnel-analysis') {
        const isActive = document.getElementById('page-funnel')?.classList.contains('active');
        if (!isActive && typeof activePage !== 'undefined' && activePage !== 'funnel') return null;
      }
    } catch(e){}

    if(e){ e.preventDefault(); e.stopPropagation(); }
    if(type==='custom'){ funnel_openCustom(e); return; }
    funnel_filters.time=type;
    // 去掉加载动画
    setTimeout(()=>{ funnel_render(); }, 150);
  };
  window.funnel_set=function(e,k,v){ if(e){ e.preventDefault(); e.stopPropagation(); } funnel_filters[k]=v; document.querySelectorAll('#page-funnel .funnel_dropdown').forEach(d=>d.classList.remove('show')); funnel_render(); };

  // 自定义弹窗
  window.funnel_openCustom=function(e){

    const mask=document.getElementById('funnel_custom_mask');

    const endInput=document.getElementById('funnel_end_date');
    const current=funnel_getRange(funnel_filters.time);
    if(funnel_custom_range.start){ startInput.value=funnel_custom_range.start.toISOString().split('T')[0]; endInput.value=funnel_custom_range.end.toISOString().split('T')[0]; }
    else{ startInput.value=current.start.toISOString().split('T')[0]; endInput.value=current.end.toISOString().split('T')[0]; }
    funnel_earliest=funnel_getEarliest();
    funnel_validateCustom();
    mask.classList.add('show');
  };
  window.funnel_closeCustom=function(e){ if(e){ e.preventDefault(); e.stopPropagation(); } document.getElementById('funnel_custom_mask').classList.remove('show'); };
  window.funnel_validateCustom=function(){
    const sI=document.getElementById('funnel_start_date'); const eI=document.getElementById('funnel_end_date'); const btn=document.getElementById('funnel_apply_btn');
    const sErr=document.getElementById('funnel_start_err'); const eErr=document.getElementById('funnel_end_err');
    let valid=true;
    if(!sI.value || !eI.value) valid=false;
    else{
      const sD=new Date(sI.value); const eD=new Date(eI.value);
      if(eD < sD){ eErr.textContent='结束日期不能早于开始日期'; eErr.style.display='block'; eI.classList.add('invalid'); valid=false; } else { eErr.style.display='none'; eI.classList.remove('invalid'); }

  };

  document.addEventListener('DOMContentLoaded', ()=>{

      const path = window.location.pathname;
      const isFileProtocol = window.location.protocol === 'file:';
      const shouldRender = isFileProtocol ? (typeof activePage !== 'undefined' && activePage==='funnel') : (path === '/funnel-analysis');
      if (shouldRender) {
        funnel_render();
      } else {
        const el = document.getElementById('funnelAnalysisModule');
        if (el) el.innerHTML = '';
      }
      try {
        const orig=localStorage.setItem;
        localStorage.setItem=function(k,v){
          orig.apply(this,arguments);
          if(k==='haisic_customers'){
            setTimeout(()=>{
              const curPath = window.location.pathname;
              const isFunnelNow = (window.location.protocol === 'file:') ? (activePage==='funnel') : (curPath === '/funnel-analysis');
              if (isFunnelNow) funnel_render();
            },400);
          }
        };
      } catch(e){}
    }, 400);
  });

  window.addEventListener('popstate', ()=>{
    const path = window.location.pathname;
    const page = PAGE_FROM_ROUTE[path] || 'ops';
    if (page) {
      switchPage(page);
    }
  });

  (function initRoute(){
    try {
      const path = window.location.pathname;
      if (path && path !== '/' && PAGE_FROM_ROUTE[path]) {

        setTimeout(()=>switchPage(page), 50);
